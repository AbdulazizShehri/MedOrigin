# Build and test exactly the PR-head source. Never publish or upload artifacts.
name: MedOrigin Developer Beta offline rehearsal

on:
  pull_request:
    paths:
      - "scripts/qualify_medorigin_developer_beta.py"
      - "scripts/smoke_medorigin_native_desktop_installed.py"
      - "tests/test_synthetic_fhir_native_desktop_demo.py"
      - "scripts/stage_medorigin_core_projection.py"
      - "scripts/check_core_wheel_source_identity.py"
      - "scripts/check_sdist_publication_scope.py"
      - "scripts/inspect_release_wheel_metadata.py"
      - "examples/synthetic_fhir_developer_beta/**"
      - "tests/test_medorigin_prepublication_rehearsal.py"
      - "tests/test_core_r4_required_status_bindings.py"
      - "src/medscale/fhirkit/bundle.py"
      - "src/medscale/fhirkit/bundle_diagnostics.py"
      - "scripts/qa_medorigin_installed_r4_status_binding.py"
      - ".github/workflows/medorigin-developer-beta-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medorigin-beta-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-artifact-rehearsal:
    name: Offline rehearsal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout exact revision, without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch only the immutable triggering commit, not every historical
          # branch/ref. Old extremely long branch names exceed Windows Git paths.
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned uv, cache disabled
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Build from committed source, verify and execute two clean installs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv python install '3.11' '3.12'
          if ($LASTEXITCODE -ne 0) { throw 'Python installation failed' }

          $pythonBuild = (& uv python find '3.12').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot find build interpreter' }
          $scratch = Join-Path $env:RUNNER_TEMP 'medorigin-beta-rehearsal'
          if (Test-Path $scratch) { throw 'Refuse to overwrite an existing rehearsal' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          # The isolated projector atomically renames its temp directory.
          # On hosted Windows, default TEMP is C: while RUNNER_TEMP is D:;
          # keep both source and destination on the same volume.
          $env:TMPDIR = $scratch
          $env:TEMP = $scratch
          $env:TMP = $scratch
          $stage = Join-Path $scratch 'projected'
          $dist = Join-Path $scratch 'dist'

          & $pythonBuild scripts/stage_medorigin_core_projection.py --out $stage
          if ($LASTEXITCODE -ne 0) { throw 'Committed-source projection rejected' }

          uv build --sdist --wheel $stage --out-dir $dist
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }

          $wheel = Join-Path $dist 'medscale-0.3.0-py3-none-any.whl'
          $sdist = Join-Path $dist 'medscale-0.3.0.tar.gz'
          if (!(Test-Path $wheel) -or !(Test-Path $sdist)) {
            throw 'Expected exact package artifacts missing'
          }

          $venv311 = Join-Path $scratch 'py311'
          $venv312 = Join-Path $scratch 'py312'
          uv venv --python '3.11' $venv311
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.11 venv failed' }
          uv venv --python '3.12' $venv312
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.12 venv failed' }

          $suffix = if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' }
          $python311 = Join-Path $venv311 $suffix
          $python312 = Join-Path $venv312 $suffix
          uv pip install --python $python311 --no-index --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.11 offline wheel install failed' }
          uv pip install --python $python312 --no-index --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.12 offline wheel install failed' }

          # Exercise the VERSIONED truthful Developer Beta v2 contract on
          # this exact source before the installed-Wheel CLI/Windows GUI E2E.
          # Reuse the same existing Linux/Windows job and ephemeral uv Python,
          # with pinned offline-only test inputs; never publish artifacts.
          # The source-only unit environment intentionally has no installed
          # application Wheel. Make the checkout packages importable for only
          # this unit step, then scrub PYTHONPATH before source-bound CLI E2E.
          $oldPythonPath = $env:PYTHONPATH
          $sourceTestPaths = @(
            (Join-Path (Get-Location).Path 'src'),
            (Join-Path (Get-Location).Path 'apps/workspace/src'),
            (Join-Path (Get-Location).Path 'tests')
          )
          $env:PYTHONPATH = $sourceTestPaths -join [System.IO.Path]::PathSeparator
          try {
            uv run --no-project --python $pythonBuild --with 'pytest==8.4.2' `
              -- python -m pytest -q `
              tests/test_truthful_synthetic_fhir_beta_v2.py `
              tests/test_synthetic_fhir_native_desktop_demo.py `
              tests/test_medorigin_prepublication_rehearsal.py
            $unitTestExit = $LASTEXITCODE
          } finally {
            if ([string]::IsNullOrEmpty($oldPythonPath)) {
              Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
            } else {
              $env:PYTHONPATH = $oldPythonPath
            }
          }
          if ($unitTestExit -ne 0) {
            throw 'Truthful Developer Beta v2 source contract tests failed'
          }
          Write-Output 'TRUTHFUL_SYNTHETIC_BETA_V2_UNIT_PASS_NOT_RELEASE'

          # Retrieve only the canonical, permanent HL7 FHIR R4 v4.0.1
          # published JSON Schema archive into ephemeral CI scratch.
          # Network retrieval is CI SETUP ONLY. The running application
          # retains its strict offline/no-download rule, and all data here
          # are fictional. Refuse missing/tampered archives; never downgrade
          # the genuine official schema test to a skip.
          $r4Zip = Join-Path $scratch 'hl7-r4-4.0.1-official-schema.zip'
          $r4Url = 'https://www.hl7.org/fhir/R4/fhir.schema.json.zip'
          try {
            Invoke-WebRequest -Uri $r4Url -OutFile $r4Zip `
              -TimeoutSec 60 -MaximumRedirection 2 -ErrorAction Stop
          } catch {
            throw 'Cannot obtain pinned HL7 FHIR R4 4.0.1 schema in CI'
          }
          $r4ExpectedSha = '75e5560da3cf503895a44c8ca7af17a83b4cca6c2cb5ba1883d2aec0d1cb5ac6'
          if (
            !(Test-Path -LiteralPath $r4Zip -PathType Leaf) -or
            (Get-Item -LiteralPath $r4Zip).Length -gt 500000 -or
            (Get-FileHash -LiteralPath $r4Zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $r4ExpectedSha
          ) {
            throw 'Official FHIR R4 schema archive was not source-hash qualified'
          }

          # Real HL7 v4.0.1 Draft-06 JSON Schema, checked with exact pinned
          # jsonschema and cryptography version. Tests must prove genuine
          # schema structure + the pre-encryption fail-closed behavior.
          # Source-only ephemeral PYTHONPATH and fixture env are restored
          # BEFORE immutable installed-Wheel verification and native UI QA.
          $originalSourcePath = $env:PYTHONPATH
          $oldOfficialZip = $env:MEDORIGIN_OFFICIAL_R4_SCHEMA_ZIP
          $oldOfficialImportZip = $env:MEDORIGIN_R4_OFFICIAL_SCHEMA_ZIP
          $env:PYTHONPATH = $sourceTestPaths -join [System.IO.Path]::PathSeparator
          $env:MEDORIGIN_OFFICIAL_R4_SCHEMA_ZIP = $r4Zip
          $env:MEDORIGIN_R4_OFFICIAL_SCHEMA_ZIP = $r4Zip
          try {
            uv run --no-project --python $pythonBuild `
              --with 'pytest==8.4.2' --with 'cryptography==50.0.1' `
              --with 'jsonschema==4.25.1' `
              -- python -m pytest -q `
              tests/test_core_r4_required_status_bindings.py `
              tests/test_core_synthetic_bundle_preflight.py `
              tests/test_core_multi_patient_reference_consistency.py `
              tests/test_core_bundle_rejection_operationoutcome.py `
              tests/test_core_fictional_files_encrypted_batch.py `
              tests/test_core_file_official_r4_before_encrypted_import.py `
              tests/test_clinical_workspace_boundary.py
            $r4SourceExit = $LASTEXITCODE
          } finally {
            if ([string]::IsNullOrEmpty($originalSourcePath)) {
              Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
            } else {
              $env:PYTHONPATH = $originalSourcePath
            }
            if ([string]::IsNullOrEmpty($oldOfficialZip)) {
              Remove-Item Env:MEDORIGIN_OFFICIAL_R4_SCHEMA_ZIP -ErrorAction SilentlyContinue
            } else {
              $env:MEDORIGIN_OFFICIAL_R4_SCHEMA_ZIP = $oldOfficialZip
            }
            if ([string]::IsNullOrEmpty($oldOfficialImportZip)) {
              Remove-Item Env:MEDORIGIN_R4_OFFICIAL_SCHEMA_ZIP -ErrorAction SilentlyContinue
            } else {
              $env:MEDORIGIN_R4_OFFICIAL_SCHEMA_ZIP = $oldOfficialImportZip
            }
          }
          if ($r4SourceExit -ne 0) {
            throw 'Official FHIR R4 v4.0.1 schema and encrypted Workspace tests failed'
          }
          Write-Output 'CORE_REAL_PINNED_HL7_R4_SCHEMA_SOURCE_GUARDS_PASS_NOT_CONFORMANCE'

          # Independently verify the truthful Core-only contract on BOTH
          # source-matched installed interpreters. This does NOT waive the
          # historical full Beta/desktop release gate below.
          # Save source-qualified, nonclinical HTML+JSON after exact Wheel,
          # sdist and both installed Python runtimes have been attested.
          # Reuse this existing CI job; no new runner, model, or cloud service.
          $coreEvidence = Join-Path $scratch 'qualified-core-negative-truth'
          & $pythonBuild scripts/qualify_medorigin_developer_beta.py `
            --checkout . --wheel $wheel --sdist $sdist `
            --python311 $python311 --python312 $python312 `
            --core-negative-truth-preview --evidence-dir $coreEvidence
          if ($LASTEXITCODE -ne 0) {
            throw 'Source-qualified durable Core negative-truth preview refused'
          }
          $expectedNames = @('core-negative-truth.html', 'core-negative-truth.json')
          $actualNames = @(Get-ChildItem -LiteralPath $coreEvidence -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ($actualNames.Count -ne 2 -or (Compare-Object $expectedNames $actualNames)) {
            throw 'Qualified Core evidence output file set was not exact'
          }
          $coreJson = Get-Content -LiteralPath (Join-Path $coreEvidence 'core-negative-truth.json') -Raw | ConvertFrom-Json
          if (
            $coreJson.status -ne 'CORE_PROVENANCE_PREVIEW_ONLY_NOT_FHIR_VALIDATION' -or
            $coreJson.clinical_use_authorized -ne $false -or
            $coreJson.publication_authorized -ne $false -or
            $coreJson.full_beta_preview_qualified -ne $false
          ) {
            throw 'Qualified Core evidence improperly claimed validation or release'
          }
          $coreHtml = Get-Content -LiteralPath (Join-Path $coreEvidence 'core-negative-truth.html') -Raw
          if (
            !$coreHtml.Contains('Not validated.') -or
            !$coreHtml.Contains('NOT AUTHORIZED') -or
            !$coreHtml.Contains("script-src 'none'") -or
            !$coreHtml.Contains("connect-src 'none'")
          ) {
            throw 'Qualified Core preview lacked negative-truth text or offline CSP'
          }
          Write-Output 'CORE_NEGATIVE_TRUTH_DURABLE_EVIDENCE_VERIFIED_NOT_RELEASE'

          & $pythonBuild scripts/qualify_medorigin_developer_beta.py `
            --checkout . --wheel $wheel --sdist $sdist `
            --python311 $python311 --python312 $python312
          if ($LASTEXITCODE -ne 0) { throw 'Exact-artifact Developer Beta rehearsal failed' }

          # Real executable entrypoints of both ACTUALLY installed source-bound
          # Core Wheel distributions on two independent Python runtimes.
          # Test exact R4 status strings and negative/refusal behavior via
          # stdin-independent, invented files. No EHR/PHI or network.
          $cliSuffix = if ($IsWindows) { 'Scripts/medscale.exe' } else { 'bin/medscale' }
          $r4Cli311 = Join-Path $venv311 $cliSuffix
          $r4Cli312 = Join-Path $venv312 $cliSuffix
          & $pythonBuild scripts/qa_medorigin_installed_r4_status_binding.py `
            --cli311 $r4Cli311 --cli312 $r4Cli312
          if ($LASTEXITCODE -ne 0) {
            throw 'Real installed Core R4 required-code behavior failed'
          }

          if ($IsWindows) {
            # Real native Tk UI and newly installed Core executables, not mocks.
            # Windows hosted CI provides the native Tcl/Tk runtime; any missing
            # desktop/runtime fails closed rather than silently passing.
            foreach ($runtime in @($venv311, $venv312)) {
              $python = Join-Path $runtime 'Scripts/python.exe'
              $cli = Join-Path $runtime 'Scripts/medscale.exe'
              & $python scripts/smoke_medorigin_native_desktop_installed.py `
                --cli $cli --timeout-seconds 75
              if ($LASTEXITCODE -ne 0) {
                throw 'Native Windows installed Core desktop E2E failed'
              }
            }
          }

          if ((git status --porcelain) -ne $null) {
            $dirty = @(git status --porcelain)
            if ($dirty.Count -gt 0) { throw 'Source checkout mutated during qualification' }
          }
          Write-Output 'TECHNICAL_ONLY_NOT_PUBLISHED'
