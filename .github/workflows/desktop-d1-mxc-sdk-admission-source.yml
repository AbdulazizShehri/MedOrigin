# Nonpublishing / synthetic-only: verifies the SDK import happens after runtime admission.
name: D1 MXC SDK admission source qualification
on:
  push:
    branches:
      - fix/medorigin-mxc-sdk-import-gate-20261031
  pull_request:
    branches:
      - test/medorigin-d1-mxc-node26-runtime-20261031
    paths:
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-d1-*.mjs'
      - '.github/workflows/desktop-d1-mxc-sdk-admission-source.yml'
permissions:
  contents: read
jobs:
  windows-source:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify admission and simulated SDK evaluation order
        shell: pwsh
        run: |
          node --test experiments/desktop-d1-tauri/tests/windows-mxc-d1-runtime-node-qualification.test.mjs experiments/desktop-d1-tauri/tests/windows-mxc-d1-sdk-import-order.test.mjs experiments/desktop-d1-tauri/tests/windows-mxc-d1-sdk-child-process.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'D1 MXC SDK admission source contract failed' }
          node --check experiments/desktop-d1-tauri/tests/windows-mxc-d1-real-app-qualification.mjs
          if ($LASTEXITCODE -ne 0) { throw 'D1 MXC launcher syntax check failed' }
      - name: Evidence boundary
        shell: pwsh
        run: |
          Write-Output 'SOURCE_ONLY_NO_NATIVE_MXC_NO_NETWORK_PACKET_ATTESTATION_NO_RELEASE'
