# NONPUBLISHING source-only Windows D1 MXC root identity regression.
# No GUI, WFP, packet capture, installer, tag, registry or release job.
name: D1 MXC root PID reuse fail-closed source contract (nonpublishing)
on:
  push:
    branches: [test/medorigin-d1-mxc-root-identity-20261031, test/medorigin-d1-mxc-descendant-continuity-20261031]
  pull_request:
    branches: [test/medorigin-d1-mxc-cold-restart-run11-20261031, test/medorigin-d1-mxc-root-identity-20261031]
    paths:
      - '.github/workflows/desktop-d1-mxc-root-identity-source.yml'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-d1-root-identity.ps1'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-d1-root-identity.test.ps1'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-d1-descendant-continuity.ps1'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-d1-descendant-continuity.test.ps1'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-d1-real-uia-qualification.ps1'
permissions:
  contents: read
jobs:
  windows-source:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
      - name: Real Windows CIM root creation-time negative tests
        shell: pwsh
        run: |
          $p='experiments/desktop-d1-tauri/tests'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$p/windows-mxc-d1-root-identity.test.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'D1 MXC root PID reuse guard failed' }
      - name: Actual Windows CIM descendant PID reuse and lineage tests
        shell: pwsh
        run: |
          $p='experiments/desktop-d1-tauri/tests'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$p/windows-mxc-d1-descendant-continuity.test.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'D1 MXC descendant PID reuse proof failed' }
      - name: Existing D1 lifecycle unit contract
        shell: pwsh
        run: |
          node --test experiments/desktop-d1-tauri/tests/windows-mxc-d1-lifecycle-proof.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'D1 lifecycle contract failed' }
      - name: Source PowerShell syntax
        shell: pwsh
        run: |
          $p='experiments/desktop-d1-tauri/tests'
          foreach ($file in @('windows-mxc-d1-root-identity.ps1','windows-mxc-d1-root-identity.test.ps1','windows-mxc-d1-descendant-continuity.ps1','windows-mxc-d1-descendant-continuity.test.ps1','windows-mxc-d1-real-uia-qualification.ps1')) {
            $tokens=$null
            $errors=$null
            $ast=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "$p/$file").Path,[ref]$tokens,[ref]$errors)
            if ($null -eq $ast -or @($errors).Count -gt 0) { throw "Invalid PowerShell syntax: $file" }
          }
      - name: Explicit scope
        shell: pwsh
        run: |
          Write-Output 'SOURCE_ONLY_NO_NATIVE_MXC_NO_WFP_NO_PACKET_CAPTURE_NO_RELEASE'
