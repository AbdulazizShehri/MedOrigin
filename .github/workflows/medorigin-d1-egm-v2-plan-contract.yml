# Nonpublishing source-only EGM documentation checks; NOT a Goldfish,
# Windows runtime, WFP packet, security, or release qualification.
name: D1 EGM v2 implementation readiness source contracts
on:
  push:
    branches:
      - docs/medorigin-d1-egm-v2-readiness-20261101
  pull_request:
    branches:
      - test/medorigin-d1-observer-stdio-failclosed-20261101
    paths:
      - 'docs/designs/D1_EGM_EXECUTION_PLAN_V2.md'
      - 'docs/designs/D1_NETWORK_CONFINEMENT_EGM.md'
      - 'docs/designs/D1_EGM_COLD_REVIEW_PACKET.md'
      - 'docs/designs/SITEMAP.md'
      - 'experiments/desktop-d1-tauri/tests/windows-d1-egm-v2-plan-contract.test.mjs'
      - '.github/workflows/medorigin-d1-egm-v2-plan-contract.yml'
permissions:
  contents: read
jobs:
  egm-v2-source-only:
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify EGM source docs, v2 readiness and fail-closed mutation cases
        shell: pwsh
        run: |
          $t='experiments/desktop-d1-tauri/tests'
          node --check "$t/windows-d1-egm-v2-plan-contract.test.mjs"
          if($LASTEXITCODE -ne 0){throw 'V2 source verifier syntax NO-GO'}
          node --test "$t/windows-d1-egm-v2-plan-contract.test.mjs" "$t/windows-d1-egm-design-contract.test.mjs"
          if($LASTEXITCODE -ne 0){throw 'EGM v2 author-side plan integrity NO-GO'}
          Write-Output 'EGM_V2_AUTHOR_SOURCE_ONLY_REVIEW_NOT_RUN_NETWORK_WFP_RELEASE_NO_GO'
