# Read-only, synthetic-only qualification of a frozen, UNAPPROVED Wheel inspector.
# No release, tag, installer, upload, artifact retention, PHI or secret permissions.
name: Wheel raw ZIP names 3OS (Draft only)

on:
  push:
    branches:
      - ci/medorigin-wheel-raw-names-3os-20261030

permissions:
  contents: read

concurrency:
  group: wheel-raw-names-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel-inspector:
    name: Wheel strict paths (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - name: Check out immutable PR 734 source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 361d9ae186d1e5d403ef0d61384239fa7d153c49
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install runtime Python
        run: uv python install ${{ matrix.python }}

      - name: Static lint at repository's pinned Ruff version
        run: >-
          uvx --python ${{ matrix.python }} ruff==0.14.4 check
          scripts/inspect_release_wheel_metadata.py tests/test_inspect_release_wheel_metadata.py

      - name: Formatting at repository's pinned Ruff version
        run: >-
          uvx --python ${{ matrix.python }} ruff==0.14.4 format --check
          scripts/inspect_release_wheel_metadata.py tests/test_inspect_release_wheel_metadata.py

      - name: Complete source-bound, dependency-isolated pytest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "361d9ae186d1e5d403ef0d61384239fa7d153c49"
          mkdir -p .wheel-qa-synthetic/scripts .wheel-qa-synthetic/tests
          cp scripts/inspect_release_wheel_metadata.py .wheel-qa-synthetic/scripts/
          cp tests/test_inspect_release_wheel_metadata.py .wheel-qa-synthetic/tests/
          cd .wheel-qa-synthetic
          uv run --no-project --python "${{ matrix.python }}" --with "pytest==8.4.2" python -m pytest -q --tb=short tests/test_inspect_release_wheel_metadata.py
          echo "WHEEL_RAW_ZIP_3OS_SOURCE_PROOF_NOT_PUBLICATION_AUTHORITY"
