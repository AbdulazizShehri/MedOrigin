# T1 EGM read-only inventory SOURCE CONTRACT ONLY. No live OS query, WFP/ETW,
# MXC capture, privilege changes, security sign-off or release.
name: D1 EGM T1 read-only capability source contracts
on:
  push:
    branches:
      - test/medorigin-d1-egm-t1-inventory-20261101
  pull_request:
    branches:
      - test/medorigin-d1-egm-t2-source-verdict-20261101
    paths:
      - 'experiments/desktop-d1-tauri/tests/windows-d1-observer-capability-inventory.mjs'
      - 'experiments/desktop-d1-tauri/tests/windows-d1-observer-capability-inventory.test.mjs'
      - 'experiments/desktop-d1-tauri/evidence/windows-d1-egm-t1-readonly-feasibility-20261101.md'
      - '.github/workflows/medorigin-d1-egm-t1-inventory-source.yml'
permissions:
  contents: read
jobs:
  t1-source-only:
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Source-only fail-closed inventory mutation tests
        shell: pwsh
        run: |
          $t='experiments/desktop-d1-tauri/tests'
          node --check "$t/windows-d1-observer-capability-inventory.mjs"
          if($LASTEXITCODE -ne 0){throw 'T1 source syntax NO-GO'}
          node --check "$t/windows-d1-observer-capability-inventory.test.mjs"
          if($LASTEXITCODE -ne 0){throw 'T1 test syntax NO-GO'}
          node --test "$t/windows-d1-observer-capability-inventory.test.mjs"
          if($LASTEXITCODE -ne 0){throw 'T1 source mutations NO-GO'}
          Write-Output 'D1_EGM_T1_SOURCE_ONLY_OS_OBSERVER_NOT_RUN_RELEASE_NO_GO'
