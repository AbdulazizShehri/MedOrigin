# Nonpublishing synthetic-only source tests. Not real MXC, WFP/ETW, OS packet,
# DNS, WebView2, PHI, clinical readiness or release security qualification.
name: D1 MXC positive TCP peer receipts (source-only)
on:
  push:
    branches:
      - test/medorigin-d1-mxc-tcp-peer-receipts-20261102
  pull_request:
    branches:
      - test/medorigin-d1-mxc-listener-evidence-20261102
    paths:
      - '.github/workflows/medorigin-d1-mxc-tcp-peer-receipts.yml'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-tcp-peer-receipts.test.mjs'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-tcp-challenge-receipts.test.mjs'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-protocol-matrix-probe.rs'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-protocol-matrix-verdict.mjs'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-protocol-matrix-negative.mjs'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-positive-control-integrity.test.mjs'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-listener-evidence.test.mjs'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-unconfined-loopback-qualification.mjs'
permissions:
  contents: read
jobs:
  windows-source-only:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fail closed on unbound TCP positive-control peer evidence
        shell: pwsh
        run: |
          $p='experiments/desktop-d1-tauri/tests'
          node --check "$p/windows-mxc-protocol-matrix-verdict.mjs"
          if($LASTEXITCODE -ne 0){throw 'Verifier syntax NO-GO'}
          node --check "$p/windows-mxc-protocol-matrix-negative.mjs"
          if($LASTEXITCODE -ne 0){throw 'Runner syntax NO-GO'}
          node --check "$p/windows-mxc-unconfined-loopback-qualification.mjs"
          if($LASTEXITCODE -ne 0){throw 'Local-only native-control syntax NO-GO'}
          node --test "$p/windows-mxc-tcp-challenge-receipts.test.mjs" "$p/windows-mxc-tcp-peer-receipts.test.mjs" "$p/windows-mxc-listener-evidence.test.mjs" "$p/windows-mxc-positive-control-integrity.test.mjs" "$p/windows-mxc-protocol-matrix-verdict.test.mjs" "$p/windows-mxc-protocol-matrix-stdio.test.mjs" "$p/windows-mxc-protocol-matrix-contract.test.mjs"
          if($LASTEXITCODE -ne 0){throw 'Source-only TCP peer provenance NO-GO'}
          Write-Output 'D1_MXC_TCP_PEER_SOURCE_ONLY_NOT_NATIVE_OR_OS_PACKET_ATTESTATION'
