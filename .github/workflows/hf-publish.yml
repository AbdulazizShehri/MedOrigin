name: Hugging Face Trusted Publication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: publication preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.HF_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Verify exact committed publication authority and external policy
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: >-
          uv run --locked --script scripts/mesc_hf_publish.py preflight
          --expected-repository "${GITHUB_REPOSITORY}"
          --expected-sha "${GITHUB_SHA}"
          --expected-workflow-ref "${GITHUB_WORKFLOW_REF}"

  publish:
    name: trusted publication
    needs: preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.HF_PUBLISH_ENABLED == 'true' &&
      needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: huggingface-publication
    permissions:
      contents: read
      issues: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Publish exact governed bytes with Trusted Publisher OIDC
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: >-
          uv run --locked --script scripts/mesc_hf_publish.py publish
          --expected-repository "${GITHUB_REPOSITORY}"
          --expected-sha "${GITHUB_SHA}"
          --expected-workflow-ref "${GITHUB_WORKFLOW_REF}"
          --receipt-out "${RUNNER_TEMP}/mesc-hf-publication-receipt.json"
          --github-run-id "${GITHUB_RUN_ID}"
          --github-run-attempt "${GITHUB_RUN_ATTEMPT}"
          --github-actor "${GITHUB_ACTOR}"
      - name: Verify publication receipt exists
        run: test -s "${RUNNER_TEMP}/mesc-hf-publication-receipt.json"
      - name: Preserve publication receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mesc-hf-publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mesc-hf-publication-receipt.json
          if-no-files-found: error
          retention-days: 90


  admit-receipt:
    name: canonical receipt admission
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download exact publication receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mesc-hf-publication-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mesc-hf-receipt
      - name: Validate and prepare canonical receipt evidence
        env:
          RECEIPT_PATH: ${{ runner.temp }}/mesc-hf-receipt/mesc-hf-publication-receipt.json
          COMMENT_PATH: ${{ runner.temp }}/mesc-hf-publication-receipt.md
          ISSUE_PATH: ${{ runner.temp }}/mesc-hf-publication-issue.txt
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          receipt_path = Path(os.environ["RECEIPT_PATH"])
          raw = receipt_path.read_bytes()
          try:
              receipt = json.loads(raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit("publication receipt is not valid UTF-8 JSON") from exc

          expected_keys = {
              "artifact_manifest_sha256",
              "authority_body_sha256",
              "authority_comment_id",
              "authority_issue_number",
              "destination_commit",
              "destination_owner",
              "destination_repo",
              "destination_repo_type",
              "environment_policy_sha256",
              "github_actor",
              "github_run_attempt",
              "github_run_id",
              "plan_sha256",
              "publication_mode",
              "readback_verified",
              "schema_version",
              "source_repository",
              "source_sha",
              "source_tag",
              "source_tree",
              "workflow_ref",
              "workflow_sha",
          }
          if type(receipt) is not dict or set(receipt) != expected_keys:
              raise SystemExit("publication receipt schema drifted")
          if receipt["schema_version"] != "MESC-HF-PUBLICATION-RECEIPT-V1":
              raise SystemExit("publication receipt version drifted")
          if receipt["source_repository"] != os.environ["EXPECTED_REPOSITORY"]:
              raise SystemExit("publication receipt repository drifted")
          if receipt["github_run_id"] != os.environ["EXPECTED_RUN_ID"]:
              raise SystemExit("publication receipt run id drifted")
          if receipt["github_run_attempt"] != os.environ["EXPECTED_RUN_ATTEMPT"]:
              raise SystemExit("publication receipt run attempt drifted")
          if receipt["workflow_sha"] != os.environ["EXPECTED_WORKFLOW_SHA"]:
              raise SystemExit("publication receipt workflow SHA drifted")
          if receipt["workflow_ref"] != os.environ["EXPECTED_WORKFLOW_REF"]:
              raise SystemExit("publication receipt workflow identity drifted")
          if receipt["readback_verified"] is not True:
              raise SystemExit("publication receipt lacks immutable readback proof")

          issue_number = receipt["authority_issue_number"]
          if type(issue_number) is not int or issue_number <= 0:
              raise SystemExit("publication receipt authority issue is invalid")
          if type(receipt["authority_comment_id"]) is not int or receipt["authority_comment_id"] <= 0:
              raise SystemExit("publication receipt authority comment is invalid")

          sha40 = re.compile(r"^[0-9a-f]{40}$")
          sha64 = re.compile(r"^[0-9a-f]{64}$")
          for field in ("destination_commit", "source_sha", "source_tree", "workflow_sha"):
              if type(receipt[field]) is not str or sha40.fullmatch(receipt[field]) is None:
                  raise SystemExit(f"publication receipt {field} is invalid")
          for field in (
              "artifact_manifest_sha256",
              "authority_body_sha256",
              "environment_policy_sha256",
              "plan_sha256",
          ):
              if type(receipt[field]) is not str or sha64.fullmatch(receipt[field]) is None:
                  raise SystemExit(f"publication receipt {field} is invalid")

          receipt_sha256 = hashlib.sha256(raw).hexdigest()
          body = (
              "## MESC Hugging Face publication receipt\n\n"
              "Canonical GitHub evidence admitted by the publication workflow after "
              "immutable Hugging Face readback.\n\n"
              f"- workflow run: `{receipt['github_run_id']}`\n"
              f"- workflow attempt: `{receipt['github_run_attempt']}`\n"
              f"- receipt SHA-256: `{receipt_sha256}`\n\n"
              "```json\n"
              + raw.decode("utf-8")
              + "\n```\n"
          )
          Path(os.environ["COMMENT_PATH"]).write_text(body, encoding="utf-8")
          Path(os.environ["ISSUE_PATH"]).write_text(str(issue_number), encoding="ascii")
          PY
      - name: Admit receipt to canonical GitHub evidence
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_PATH: ${{ runner.temp }}/mesc-hf-publication-receipt.md
          ISSUE_PATH: ${{ runner.temp }}/mesc-hf-publication-issue.txt
        run: >-
          gh issue comment "$(cat "${ISSUE_PATH}")"
          --repo "${GITHUB_REPOSITORY}"
          --body-file "${COMMENT_PATH}"
