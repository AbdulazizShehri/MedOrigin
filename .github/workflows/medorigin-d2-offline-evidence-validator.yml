name: D2 offline evidence validator (nonpublishing)
on:
  push:
    branches:
      - docs/medorigin-d2-offline-acceptance-20261102
  pull_request:
    paths:
      - 'experiments/desktop-d2-native-egui/tests/verify_offline_evidence.py'
      - 'experiments/desktop-d2-native-egui/tests/test_verify_offline_evidence.py'
      - 'experiments/desktop-d2-native-egui/tests/linux-private-netns-smoke.py'
      - 'experiments/desktop-d2-native-egui/tests/linux-private-netns-smoke.sh'
      - 'experiments/desktop-d2-native-egui/tests/linux-wsl-interop-refusal-integration.sh'
      - 'experiments/desktop-d2-native-egui/tests/test_linux_private_netns_host_interop.py'
      - 'experiments/desktop-d2-native-egui/tests/verify_linux_accesskit_maintenance.py'
      - 'experiments/desktop-d2-native-egui/tests/test_verify_linux_accesskit_maintenance.py'
      - 'experiments/desktop-d2-native-egui/src/**'
      - 'experiments/desktop-d2-native-egui/Cargo.toml'
      - 'experiments/desktop-d2-native-egui/Cargo.lock'
      - 'experiments/desktop-d2-native-egui/tests/windows-native-fictional-compare-uia.ps1'
      - 'experiments/desktop-d2-native-egui/tests/windows-native-fictional-compare-keyboard.ps1'
      - 'experiments/desktop-d2-native-egui/tests/windows-native-fictional-json-pointer-uia.ps1'
      - 'experiments/desktop-d2-native-egui/tests/windows-offline-powershell-ast-gate.ps1'
      - '.github/workflows/medorigin-d2-offline-evidence-validator.yml'
permissions:
  contents: read
jobs:
  offline-evidence-structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify evidence packet always fails closed on missing inputs
        working-directory: experiments/desktop-d2-native-egui/tests
        run: python3 -m unittest -v test_verify_offline_evidence.py
      - name: Reject Windows process-broker escape in Linux netns evidence
        working-directory: experiments/desktop-d2-native-egui/tests
        run: |
          python3 -m unittest -v test_linux_private_netns_host_interop.py
          bash -n linux-private-netns-smoke.sh
          bash -n linux-wsl-interop-refusal-integration.sh
          bash -n linux-private-netns-negative-gates.sh
      - name: Maintain source-only warning for unmaintained Linux accessibility transitives
        working-directory: experiments/desktop-d2-native-egui/tests
        run: |
          python3 -m unittest -v test_verify_linux_accesskit_maintenance.py
          # This source check does not run cargo or claim refreshed RustSec approval.
      - name: Compile script source
        run: python3 -m py_compile experiments/desktop-d2-native-egui/tests/verify_offline_evidence.py experiments/desktop-d2-native-egui/tests/test_verify_offline_evidence.py
      - name: Verify no tracked code changed
        run: git diff --exit-code
