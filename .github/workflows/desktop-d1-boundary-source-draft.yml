# Strictly source-only: this checks truthful D1 NO-GO claims, NOT network isolation.
name: D1 network-boundary source NO-GO contract

on:
  push:
    branches:
      - test/medorigin-d1-offline-policy-gate-20261030
  pull_request:
    branches:
      - fix/medorigin-d1-mxc-orphan-failclosed-20261030

permissions:
  contents: read

concurrency:
  group: d1-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: D1 source boundary (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout exact commit without persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Source must remain explicit D1 network NO-GO
        run: >-
          uv run --no-project --python ${{ matrix.python-version }}
          python scripts/verify_d1_network_boundary.py

      - name: Run negative mutation cases without GUI/network operations
        run: >-
          uv run --no-project --python ${{ matrix.python-version }}
          python -m unittest discover -s tests
          -p test_d1_network_boundary_contract.py -v

      - name: Ruff lint for the small source contract
        run: >-
          uvx --python ${{ matrix.python-version }} ruff==0.14.4 check
          scripts/verify_d1_network_boundary.py
          tests/test_d1_network_boundary_contract.py

      - name: Ruff format check
        run: >-
          uvx --python ${{ matrix.python-version }} ruff==0.14.4 format --check
          scripts/verify_d1_network_boundary.py
          tests/test_d1_network_boundary_contract.py

  windows-token-preflight:
    name: Win32 AppContainer fallback preflight (mock + read-only negative)
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Parse token probe as PowerShell source
        shell: pwsh
        run: |
          $file = 'experiments/desktop-d1-tauri/tests/windows-d1-appcontainer-preflight.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw 'D1 token preflight PowerShell parser failure' }

      - name: Eight synthetic scenarios must fail closed
        shell: pwsh
        run: |
          $file = 'experiments/desktop-d1-tauri/tests/windows-d1-appcontainer-preflight.ps1'
          $result = @(& pwsh -NoProfile -File $file -SelfTest)
          if ($LASTEXITCODE -ne 0 -or
              -not ($result -contains 'D1_TOKEN_LOGIC_8_OF_8_PASS_NOT_LIVE_OR_NETWORK_PROOF') -or
              -not ($result -contains 'D1_NETWORK_ISOLATION_NO_GO')) {
            throw 'D1 token preflight synthetic negative matrix failed'
          }

      - name: Ordinary unisolated test runner must never qualify as D1
        shell: pwsh
        run: |
          $file = 'experiments/desktop-d1-tauri/tests/windows-d1-appcontainer-preflight.ps1'
          $exe = (Get-Process -Id $PID).Path
          $result = @(& pwsh -NoProfile -File $file -RootPid $PID -ExpectedExePath $exe 2>&1)
          if ($LASTEXITCODE -eq 0 -or -not (@($result | ForEach-Object { [string]$_ }) -match 'NO_GO')) {
            throw 'Unisolated test runner incorrectly qualified or produced no NO-GO marker'
          }
          Write-Output 'D1_TEST_RUNNER_REJECTED_NO_NETWORK_ISOLATION_PROOF'
