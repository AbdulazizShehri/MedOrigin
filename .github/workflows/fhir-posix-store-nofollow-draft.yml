# Nonpublishing, synthetic-only source qualification. No artifacts or release.
name: FHIR POSIX store and Windows native-load Draft qualification

on:
  push:
    branches:
      - fix/medorigin-fhir-posix-nofollow-store-20261031
      - fix/medorigin-fhir-windows-noreparse-native-load-20261031
  pull_request:
    branches:
      - fix/medorigin-fhir-posix-nofollow-load-20261031
      - fix/medorigin-fhir-posix-nofollow-store-20261031

permissions:
  contents: read

concurrency:
  group: fhir-posix-store-nofollow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fhir-store-nofollow:
    name: FHIR store nofollow (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - name: Checkout exact Draft source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Install pinned uv without cache
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Pinned source lint and format
        run: |
          uvx --python ${{ matrix.python }} ruff==0.14.4 check src/medscale/fhirkit/storage.py tests/test_fhir_storage_atomic_publish.py tests/test_fhir_posix_store_nofollow_race.py tests/test_fhir_windows_native_load_junction_race.py
          uvx --python ${{ matrix.python }} ruff==0.14.4 format --check --diff src/medscale/fhirkit/storage.py tests/test_fhir_storage_atomic_publish.py tests/test_fhir_posix_store_nofollow_race.py tests/test_fhir_windows_native_load_junction_race.py

      - name: Synthetic POSIX store/load race and cross-platform FHIR regressions
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-project --python ${{ matrix.python }} --with pytest==8.4.2
          python -m pytest -q
          tests/test_fhir_posix_store_nofollow_race.py
          tests/test_fhir_posix_load_nofollow_race.py
          tests/test_fhir_posix_ancestor_symlinks.py
          tests/test_fhir_windows_junction_storage.py
          tests/test_fhir_windows_native_load_junction_race.py
          tests/test_fhir_storage_atomic_publish.py
          tests/test_fhir_storage_bounded.py
          tests/test_fhir_windows_output_path.py
          tests/test_fhir_windows_path_admission.py
          tests/test_fhirkit.py
          tests/test_fhir_cli.py

      - name: Nonpublishing marker
        run: echo "FHIR_POSIX_NOFOLLOW_STORE_SOURCE_ONLY_NOT_RELEASE"
