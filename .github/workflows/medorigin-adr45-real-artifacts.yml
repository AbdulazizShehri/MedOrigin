# ADR-0045 is PROPOSED: source-only, nonpublishing, and no dependency extras allowed.
# Build the real archives only in the ephemeral runner.temp; NEVER upload them.
name: ADR45 real Core Wheel and sdist source-bound qualification (nonpublishing)
on:
  push:
    branches:
      - test/medorigin-adr45-real-artifacts-20261031
      - fix/medorigin-adr45-windows-dist-junction-20261031
      - fix/medorigin-adr45-windows-namespace-20261031
  pull_request:
    branches:
      - test/medorigin-adr45-dist-envelope-20261031
      - test/medorigin-adr45-real-artifacts-20261031
      - fix/medorigin-adr45-windows-dist-junction-20261031
    paths:
      - '.github/workflows/medorigin-adr45-real-artifacts.yml'
      - 'scripts/stage_medorigin_base_only_proposal.py'
      - 'scripts/stage_medorigin_core_projection.py'
      - 'scripts/verify_medorigin_base_only_proposal.py'
      - 'tests/test_verify_medorigin_base_only_proposal.py'
      - 'docs/adr45-real-artifact-qualification-20261031.md'
permissions:
  contents: read
jobs:
  real-archive-verification:
    name: Real source-bound unpublished archives (${{ matrix.os }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.12']
    steps:
      - name: Checkout exact source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pinned free uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Stage, build, verify, and reject a rogue real-dist file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '${{ matrix.python }}'
          $root = (Get-Location).Path
          $scratch = Join-Path $env:RUNNER_TEMP 'adr45-real-artifacts'
          $stage = Join-Path $scratch 'proposed-core-source'
          $dist = Join-Path $stage 'dist'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          uv python install $python
          if ($LASTEXITCODE -ne 0) { throw 'Python toolchain installation failed' }
          uv run --no-project --python $python python scripts/stage_medorigin_base_only_proposal.py --out $stage
          if ($LASTEXITCODE -ne 0) { throw 'Exact Git source projection failed' }
          uv run --no-project --python $python --with build==1.3.0 --with hatchling==1.32.4 python -m build --no-isolation --wheel --sdist $stage --outdir $dist
          if ($LASTEXITCODE -ne 0) { throw 'Real Wheel/sdist build failed' }
          $names = @(Get-ChildItem -LiteralPath $dist -File | ForEach-Object Name | Sort-Object)
          $expected = @('medscale-0.3.0-py3-none-any.whl', 'medscale-0.3.0.tar.gz') | Sort-Object
          if (@(Compare-Object $names $expected).Count -gt 0) {
            throw 'Real dist does not have the two exact expected archives'
          }
          $env:PYTHONPATH = [string]::Join(
            [IO.Path]::PathSeparator,
            @((Join-Path $root 'src'), (Join-Path $root 'scripts'), (Join-Path $root 'tests'))
          )
          $env:MEDORIGIN_PROPOSAL_TEST_DIST = $dist
          uv run --no-project --python $python --with pytest==8.4.2 python -m pytest -q -o addopts= --basetemp (Join-Path $scratch 'pytest') tests/test_verify_medorigin_base_only_proposal.py
          if ($LASTEXITCODE -ne 0) { throw 'Real artifact source-bound verifier test failed' }
          $receipt = Join-Path $scratch 'source-bound-verification.json'
          uv run --no-project --python $python python scripts/verify_medorigin_base_only_proposal.py --dist $dist --out $receipt
          if ($LASTEXITCODE -ne 0) { throw 'Real archive verification rejected exact source' }
          $checked = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if (
            $checked.status -ne 'BASE_ONLY_PROPOSAL_SOURCE_BOUND_VERIFIED' -or
            $checked.publication_authorized -cne $false -or
            $checked.independent_review_complete -cne $false
          ) { throw 'Unexpected proposal/approval receipt status' }
          $rogue = Join-Path $dist 'unaccounted-artifact.txt'
          [IO.File]::WriteAllBytes($rogue, [byte[]](1, 2, 3, 4))
          uv run --no-project --python $python python scripts/verify_medorigin_base_only_proposal.py --dist $dist --out (Join-Path $scratch 'must-not-exist.json')
          $blocked = $LASTEXITCODE
          Remove-Item -LiteralPath $rogue -Force
          if ($blocked -ne 2) { throw "Expected a strict rogue-artifact refusal (exit 2); got $blocked" }
          # The negative control intentionally returned 2; reset native CLI status only
          # AFTER confirming the exact fail-closed result, or pwsh fails the whole job.
          $global:LASTEXITCODE = 0
          Write-Output 'ADR45_REAL_WHEEL_SDIST_BOUND_TO_GIT_PASS'
          Write-Output 'ADR45_ROGUE_REAL_DIST_REJECTED'
          Write-Output 'ADR45_PROPOSED_NOT_ACCEPTED_PUBLICATION_FALSE'
      - name: No external artifact or publishing step
        shell: pwsh
        run: |
          Write-Output 'REAL_BUILD_AND_PROOF_EPHEMERAL_RUNNER_TEMP_ONLY'
          Write-Output 'NOT_INDEPENDENT_SECURITY_REVIEW_OR_ADR_ACCEPTANCE'
          Write-Output 'NO_TAG_NO_GITHUB_RELEASE_NO_PYPI_NO_PHI'
