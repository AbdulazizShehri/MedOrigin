# Source-only publisher wildcard safety check: never publish artifacts.
name: MedOrigin dist directory exact-two-files regression (nonpublishing)

on:
  push:
    branches:
      - test/medorigin-core-dist-extra-rejection-20261031
      - fix/medorigin-core-dist-ancestor-alias-20261031
      - fix/medorigin-core-scope-pinned-snapshots-20261031
      - fix/medorigin-core-windows-handle-snapshot-20261031
      - fix/medorigin-core-windows-dist-handle-admission-20261031
      - fix/medorigin-core-posix-dist-identity-20261031
      - feat/medorigin-core-inspected-snapshot-digests-20261031
      - security/medorigin-core-verified-handoff-20261031
  pull_request:
    branches:
      - candidate/medorigin-fhir-wheel-unpublished-20261030
      - test/medorigin-core-dist-extra-rejection-20261031
      - fix/medorigin-core-dist-ancestor-alias-20261031
      - fix/medorigin-core-scope-pinned-snapshots-20261031
      - fix/medorigin-core-windows-handle-snapshot-20261031
      - fix/medorigin-core-windows-dist-handle-admission-20261031
      - fix/medorigin-core-posix-dist-identity-20261031
      - feat/medorigin-core-inspected-snapshot-digests-20261031
    paths:
      - '.github/workflows/medorigin-dist-enumeration-guard.yml'
      - 'scripts/check_base_core_publication_scope.py'
      - 'tests/test_base_core_publication_scope.py'
      - 'scripts/stage_verified_core_handoff.py'
      - '.github/workflows/release.yml'
      - 'tests/test_release_workflow_contract.py'

permissions:
  contents: read

jobs:
  dist-scope-negative:
    name: Reject unaccounted dist files (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.11", "3.12"]
    steps:
      - name: Read-only source checkout at exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned free Python runtime manager
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          enable-cache: false
      - name: Run actual existing plus adversarial publisher-scope tests
        shell: bash
        run: |
          set -euo pipefail
          uv python install "${{ matrix.python }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export PYTHONPATH="$(cygpath -w "$PWD/src");$(cygpath -w "$PWD/tests")"
          else
            export PYTHONPATH="$PWD/src:$PWD/tests"
          fi
          uv run --no-project --python "${{ matrix.python }}" --with pytest==8.4.2 \
            python -m pytest -q -o addopts= \
            --basetemp "$RUNNER_TEMP/medorigin-dist-scope" \
            tests/test_base_core_publication_scope.py \
            tests/test_release_workflow_contract.py
      - name: Pinned source-only lint and formatter qualification
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python "${{ matrix.python }}" --with ruff==0.14.4 \
            ruff check scripts/check_base_core_publication_scope.py tests/test_base_core_publication_scope.py scripts/stage_verified_core_handoff.py tests/test_release_workflow_contract.py
          uv run --no-project --python "${{ matrix.python }}" --with ruff==0.14.4 \
            ruff format --check --diff scripts/check_base_core_publication_scope.py tests/test_base_core_publication_scope.py scripts/stage_verified_core_handoff.py tests/test_release_workflow_contract.py
      - name: Explicit no-publication outcome
        shell: bash
        run: |
          echo "DISTRIBUTION_DIRECTORY_ENVELOPE_SOURCE_ONLY_QUALIFIED"
          echo "UNSAFE_OPTIONAL_EXTRAS_AND_INDEPENDENT_REVIEW_STILL_NO_GO"
