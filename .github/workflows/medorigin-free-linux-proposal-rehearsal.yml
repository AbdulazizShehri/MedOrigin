name: MedOrigin Linux base-only proposal rehearsal (unpublished)

on:
  pull_request:
    branches:
      - fix/medorigin-isolated-build-vcs-ignore-20261025
      - test/medorigin-free-linux-packaging-rehearsal-20261025
      - test/medorigin-base-proposal-full-provenance-20261025

# Builder and validator are intentionally nonpublishing; no write scopes,
# package-index credentials, deployment environments, model installs, or upload.
permissions:
  contents: read

jobs:
  linux-proposal-identity:
    name: Linux source-bound Core-only proposal (NO RELEASE)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv (free)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install Python 3.11 and 3.12
        run: uv python install 3.11 3.12

      - name: Build isolated proposed Wheel and sdist, without publication
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stage_medorigin_base_only_proposal.py --out "$RUNNER_TEMP/medorigin-linux-proposal-source"
          uv build --wheel --sdist "$RUNNER_TEMP/medorigin-linux-proposal-source" --out-dir "$RUNNER_TEMP/medorigin-linux-proposal-dist"
          python3 scripts/check_base_core_publication_scope.py --dist "$RUNNER_TEMP/medorigin-linux-proposal-dist"

      - name: Inspect archive contents, provenance and exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile, zipfile
          dist = pathlib.Path(os.environ["RUNNER_TEMP"]) / "medorigin-linux-proposal-dist"
          wh = dist / "medscale-0.3.0-py3-none-any.whl"
          sd = dist / "medscale-0.3.0.tar.gz"
          def sha(raw):
              return hashlib.sha256(raw).hexdigest()
          with zipfile.ZipFile(wh) as archive:
              wheel = {info.filename: sha(archive.read(info)) for info in archive.infolist()}
          with tarfile.open(sd, "r:gz") as archive:
              items = {
                  info.name: archive.extractfile(info).read()
                  for info in archive.getmembers() if info.isfile()
              }
          assert len(wheel) == 255, len(wheel)
          assert len(items) == 258, len(items)
          assert items["medscale-0.3.0/.gitignore"] == b""
          receipt_bytes = items["medscale-0.3.0/MEDORIGIN_SOURCE_PROVENANCE.json"]
          receipt = json.loads(receipt_bytes)
          assert receipt_bytes == (json.dumps(receipt, indent=2, sort_keys=True) + "\n").encode()
          assert receipt["schema"] == "MEDORIGIN-CORE-BASE-ONLY-PROPOSAL-1"
          assert receipt["staged_vcs_ignore_sha256"] == sha(b"")
          assert receipt["adr_0044_amendment_accepted"] is False
          assert receipt["publication_authorized"] is False
          assert receipt["independent_security_review_completed"] is False
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert receipt["source_git_commit"] == commit
          assert sha(items["medscale-0.3.0/pyproject.toml"]) == receipt["projected_pyproject_sha256"]
          assert len(receipt["source_files"]) == 254
          for name, expected in receipt["source_files"].items():
              packaged = items["medscale-0.3.0/" + name]
              assert sha(packaged) == expected, name
          def digest(index):
              return sha(json.dumps(index, sort_keys=True, separators=(",", ":")).encode())
          sdist_index = {key: sha(value) for key, value in items.items()}
          print("LINUX_BASE_ONLY_SOURCE_MANIFEST_PASS")
          print("source_commit", commit)
          print("wheel_sha256", sha(wh.read_bytes()))
          print("sdist_sha256", sha(sd.read_bytes()))
          print("wheel_member_content_digest", digest(wheel))
          print("sdist_member_content_digest", digest(sdist_index))
          print("publication_authorized=false; adr_amendment_accepted=false")
          PY

      - name: Verify exact committed Git source against Wheel and sdist independently
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_medorigin_base_only_proposal.py --dist "$RUNNER_TEMP/medorigin-linux-proposal-dist"

      - name: Independently rebuild and require identical source-bound archives
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stage_medorigin_base_only_proposal.py --out "$RUNNER_TEMP/medorigin-linux-proposal-source-second"
          uv build --offline --wheel --sdist "$RUNNER_TEMP/medorigin-linux-proposal-source-second" --out-dir "$RUNNER_TEMP/medorigin-linux-proposal-dist-second"
          python3 scripts/compare_medorigin_base_only_archives.py \
            --repo . \
            --left "$RUNNER_TEMP/medorigin-linux-proposal-dist" \
            --right "$RUNNER_TEMP/medorigin-linux-proposal-dist-second" \
            --require-identical
          echo 'LINUX_SAME_HOST_REPRODUCIBLE_ARCHIVES_PASS; publication_authorized=false'

      - name: Refuse hostile Wheel even when RECORD is rehashed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, csv, hashlib, io, json, os, pathlib, shutil, subprocess, sys, zipfile
          good = pathlib.Path(os.environ["RUNNER_TEMP"]) / "medorigin-linux-proposal-dist"
          tampered = pathlib.Path(os.environ["RUNNER_TEMP"]) / "medorigin-linux-hostile-dist"
          tampered.mkdir()
          shutil.copyfile(good / "medscale-0.3.0.tar.gz", tampered / "medscale-0.3.0.tar.gz")
          original = good / "medscale-0.3.0-py3-none-any.whl"
          altered = tampered / original.name
          record = "medscale-0.3.0.dist-info/RECORD"
          victim = "medscale/__init__.py"
          with zipfile.ZipFile(original) as source:
              members = [(i, source.read(i)) for i in source.infolist()]
          new_code = next(data for info, data in members if info.filename == victim) + b"\\n# unauthorized change\\n"
          with zipfile.ZipFile(altered, "w") as target:
              for info, payload in members:
                  if info.filename == victim:
                      payload = new_code
                  elif info.filename == record:
                      lines = list(csv.reader(io.StringIO(payload.decode("utf-8"))))
                      for row in lines:
                          if row[0] == victim:
                              digest = base64.urlsafe_b64encode(hashlib.sha256(new_code).digest()).rstrip(b"=").decode()
                              row[1], row[2] = "sha256=" + digest, str(len(new_code))
                      out = io.StringIO(newline="")
                      csv.writer(out, lineterminator="\\n").writerows(lines)
                      payload = out.getvalue().encode("utf-8")
                  target.writestr(info, payload)
          result = subprocess.run(
              [sys.executable, "scripts/verify_medorigin_base_only_proposal.py", "--dist", str(tampered)],
              check=False, capture_output=True, text=True, timeout=90,
          )
          receipt = json.loads(result.stdout)
          assert result.returncode == 2, result.stdout + result.stderr
          assert receipt["status"] == "BLOCKED", receipt
          assert "Wheel code differs from Git source" in receipt["reason"], receipt
          print("LINUX_ADVERSARIAL_REHASHED_WHEEL_REFUSED")
          PY

      - name: Refuse an sdist with unqualified trailing gzip or TAR payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess, sys
          good = pathlib.Path(os.environ["RUNNER_TEMP"]) / "medorigin-linux-proposal-dist"
          damaged = pathlib.Path(os.environ["RUNNER_TEMP"]) / "medorigin-linux-trailing-sdist"
          damaged.mkdir()
          original_wheel = good / "medscale-0.3.0-py3-none-any.whl"
          original_sdist = good / "medscale-0.3.0.tar.gz"
          shutil.copyfile(original_wheel, damaged / original_wheel.name)
          payload = damaged / original_sdist.name
          shutil.copyfile(original_sdist, payload)
          with payload.open("ab") as stream:
              stream.write(b"UNQUALIFIED_TRAILING_GZIP_PAYLOAD")
          result = subprocess.run(
              [sys.executable, "scripts/verify_medorigin_base_only_proposal.py", "--dist", str(damaged)],
              check=False, capture_output=True, text=True, timeout=90,
          )
          receipt = json.loads(result.stdout)
          assert result.returncode == 2, result.stdout + result.stderr
          assert receipt["status"] == "BLOCKED", receipt
          assert "appended gzip stream" in receipt["reason"], receipt
          print("LINUX_ADVERSARIAL_APPENDED_SDIST_REFUSED")
          PY

      - name: Install offline into clean 3.11 and 3.12; replay fictional FHIR
        shell: bash
        run: |
          set -euo pipefail
          wheel="$RUNNER_TEMP/medorigin-linux-proposal-dist/medscale-0.3.0-py3-none-any.whl"
          for version in 3.11 3.12; do
            dir="$RUNNER_TEMP/medorigin-linux-venv-${version}"
            uv venv --offline --python "$version" "$dir"
            uv pip install --offline --no-index --no-deps --python "$dir/bin/python" "$wheel"
            "$dir/bin/medscale" --version
          done
          "$RUNNER_TEMP/medorigin-linux-venv-3.11/bin/python" examples/synthetic_fhir_developer_beta/reproduce.py \
            --cli "$RUNNER_TEMP/medorigin-linux-venv-3.11/bin/medscale" \
            --alt-cli "$RUNNER_TEMP/medorigin-linux-venv-3.12/bin/medscale" \
            --out "$RUNNER_TEMP/medorigin-linux-synthetic-replay"
          echo 'LINUX_SYNTHETIC_BASE_ONLY_E2E_PASS; no release published'
