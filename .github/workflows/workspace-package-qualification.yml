name: Workspace package qualification

# Synthetic-only, no release or publication side effects. Qualify the separate
# medscale-workspace wheel, not a source-tree import or a clinician application.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/workspace-package-qualification.yml"
      - "apps/workspace/**"
      - "LICENSE"
  push:
    branches: [main]
    paths:
      - ".github/workflows/workspace-package-qualification.yml"
      - "apps/workspace/**"
      - "LICENSE"

permissions:
  contents: read

jobs:
  installed-workspace-wheel:
    name: installed workspace wheel (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install exact Python minor
        run: uv python install "${{ matrix.python-version }}"

      - name: Build independently packaged Workspace wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/workspace-dist"
          uv build apps/workspace --out-dir "${RUNNER_TEMP}/workspace-dist"
          test "$(find "${RUNNER_TEMP}/workspace-dist" -maxdepth 1 -type f -name 'medscale_workspace-*.whl' | wc -l)" -eq 1
          test "$(find "${RUNNER_TEMP}/workspace-dist" -maxdepth 1 -type f -name 'medscale_workspace-*.tar.gz' | wc -l)" -eq 1
          (cd "${RUNNER_TEMP}/workspace-dist" && sha256sum -- *.whl *.tar.gz)

      - name: Verify embedded Apache-2.0 license bytes in independent Workspace wheel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list((Path(os.environ["RUNNER_TEMP"]) / "workspace-dist").glob("medscale_workspace-*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              members = [name for name in archive.namelist() if name.endswith(".dist-info/licenses/LICENSE")]
              assert len(members) == 1, members
              assert archive.read(members[0]) == Path("LICENSE").read_bytes(), "Workspace wheel license mismatch"
          print("WORKSPACE_LICENSE_BUNDLED_PASS")
          PY

      - name: Verify embedded Apache-2.0 license bytes in Workspace sdist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from tarfile import open as taropen

          dist = Path(os.environ["RUNNER_TEMP"]) / "workspace-dist"
          sdists = list(dist.glob("medscale_workspace-*.tar.gz"))
          assert len(sdists) == 1, sdists
          license_bytes = Path("LICENSE").read_bytes()
          assert Path("apps/workspace/LICENSE").read_bytes() == license_bytes

          with taropen(sdists[0], "r:gz") as archive:
              members = [m for m in archive.getmembers() if m.isfile() and m.name.endswith("/LICENSE")]
              assert len(members) == 1, [m.name for m in members]
              assert archive.extractfile(members[0]).read() == license_bytes
          print("WORKSPACE_SDIST_LICENSE_PASS")
          PY

      - name: Install exact wheel with declared pinned runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find "${RUNNER_TEMP}/workspace-dist" -maxdepth 1 -type f -name 'medscale_workspace-*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python "${{ matrix.python-version }}" "${RUNNER_TEMP}/workspace-install"
          uv pip install --python "${RUNNER_TEMP}/workspace-install/bin/python" "$wheel"
          uv pip check --python "${RUNNER_TEMP}/workspace-install/bin/python"

      - name: Smoke imported wheel from outside source tree (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/workspace-install/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import json
          import pathlib
          import subprocess
          import sys

          import medscale_workspace as workspace
          from medscale_workspace.data_class import synthetic_data_class_value

          distribution = metadata.version("medscale-workspace")
          assert distribution == workspace.__version__
          assert metadata.version("cryptography") == "50.0.1"
          assert synthetic_data_class_value() == "SYNTHETIC"
          assert "site-packages" in pathlib.Path(workspace.__file__).parts
          proc = subprocess.run(
              [sys.executable, "-m", "medscale_workspace"],
              check=True,
              text=True,
              capture_output=True,
          )
          assert proc.stderr == ""
          assert json.loads(proc.stdout) == {
              "application": "medscale-workspace",
              "data_class": "SYNTHETIC",
              "mode": "offline-shell",
              "ready": True,
          }
          print(f"WORKSPACE_WHEEL_PASS py={sys.version.split()[0]} dist={distribution}")
          PY
