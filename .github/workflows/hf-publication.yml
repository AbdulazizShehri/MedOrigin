name: Hugging Face Publication Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hf-publication.yml"
      - ".github/workflows/hf-publish.yml"
      - "scripts/mesc_hf_publication.py"
      - "scripts/mesc_hf_publish.py"
      - "scripts/mesc_hf_publish.py.lock"
      - "specs/mesc-hf-publication-v1/**"
      - "specs/mesc-hf-publication-v2/**"
      - "docs/architecture/distribution_hf.md"
      - "src/medscale/mesc/_hf_publication_v1.py"
      - "src/medscale/mesc/_hf_publication_v2.py"
      - "tests/test_mesc_hf_publication_v1.py"
      - "tests/test_mesc_hf_publication_v2.py"

concurrency:
  group: hf-publication-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publication-contracts:
    name: publication contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync exact lock
        run: uv sync --frozen
      - name: Focused Hugging Face publication qualification
        run: >-
          uv run pytest -q
          tests/test_mesc_hf_publication_v1.py
          tests/test_mesc_hf_publication_v2.py
      - name: P1 CLI import/help smoke
        run: uv run python scripts/mesc_hf_publication.py --help
      - name: P2 locked CLI authority smoke
        env:
          PYTHONPATH: src
        run: >-
          uv run --locked --script scripts/mesc_hf_publish.py
          validate-authority
      - name: P2 transport manifest smoke
        env:
          PYTHONPATH: src
        run: >-
          uv run --locked --script scripts/mesc_hf_publish.py
          transport-manifest
      - name: Verify P1 remains nonpublishing
        shell: bash
        run: |
          ! rg -n 'HF_TOKEN|HUGGING_FACE_HUB_TOKEN|push_to_hub|create_repo|upload_file|upload_folder' \
            src/medscale/mesc/_hf_publication_v1.py \
            scripts/mesc_hf_publication.py
      - name: Verify P2 exposes no repository-creation or stored-secret surface
        shell: bash
        run: |
          ! rg -n 'secrets\.|create_repo\(|delete_repo\(|push_to_hub\(|upload_file\(|upload_folder\(' \
            src/medscale/mesc/_hf_publication_v2.py \
            scripts/mesc_hf_publish.py \
            .github/workflows/hf-publish.yml
