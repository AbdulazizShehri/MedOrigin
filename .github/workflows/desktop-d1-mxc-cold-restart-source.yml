# NONPUBLISHING source-only CI; no MXC runtime, packet capture or installer.
name: D1 MXC cold-restart process-lifecycle source contract (nonpublishing)
on:
  push:
    branches: [test/medorigin-d1-mxc-cold-restart-20261031]
  pull_request:
    branches: [fix/medorigin-d1-capture-v1-config-20261031]
    paths:
      - '.github/workflows/desktop-d1-mxc-cold-restart-source.yml'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-d1-lifecycle-*'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-d1-cold-restart-qualification.mjs'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-d1-real-uia-qualification.ps1'
      - 'experiments/desktop-d1-tauri/README.md'
permissions:
  contents: read
jobs:
  windows-source:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
      - name: Fail-closed lifecycle contract unit tests (no native MXC)
        shell: pwsh
        run: |
          $p='experiments/desktop-d1-tauri/tests'
          node --check "$p/windows-mxc-d1-lifecycle-proof.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Lifecycle parser syntax failed' }
          node --check "$p/windows-mxc-d1-cold-restart-qualification.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Cold restart runner syntax failed' }
          node --test "$p/windows-mxc-d1-lifecycle-proof.test.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Lifecycle source contract tests failed' }
      - name: UIA observer PowerShell AST grammar (not interactive)
        shell: pwsh
        run: |
          $p=(Resolve-Path 'experiments/desktop-d1-tauri/tests/windows-mxc-d1-real-uia-qualification.ps1').Path
          $tokens=$null
          $errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if ($null -eq $ast -or @($errors).Count -gt 0) { throw 'UIA observer grammar invalid' }
      - name: Explicit release and network limits
        shell: pwsh
        run: |
          Write-Output 'HOSTED_CI_SOURCE_ONLY_NO_MXC_NO_WFP_NO_PACKET_CAPTURE'
          Write-Output 'COLD_RESTART_HOST_EVIDENCE_NOT_RELEASE_SECURITY_APPROVAL'
