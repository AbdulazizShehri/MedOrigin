# Synthetic-only native Rust D2 integration, no GUI launch or publication.
name: D2 native fictional FHIR and offline source qualification
on:
  push:
    branches:
      - feat/medorigin-d2-native-fhir-bundle-20261102
      - feat/medorigin-d2-fictional-json-preview-20261102
  pull_request:
    paths:
      - 'experiments/desktop-d0-rust/**'
      - 'experiments/desktop-d2-native-egui/**'
      - '.github/workflows/medorigin-d2-native-fhir-qualification.yml'
permissions:
  contents: read
jobs:
  native-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout candidate by exact head SHA without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust with formatter and Clippy
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust install failed' }
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust version selection failed' }
      - name: Linux graphical build dependencies (no GUI launched)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev pkg-config
      - name: Verify exact fixed fictional Bundle JSON with no writes
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          & $py experiments/desktop-d0-rust/tools/generate_fictional_bundles.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Fictional fixture bytes drifted' }
      - name: Test actual D0 parser and fictional reference graph
        shell: pwsh
        run: |
          cargo test --locked --all-targets --manifest-path experiments/desktop-d0-rust/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'D0 Rust tests failed' }
      - name: Compile native D2 and run real Rust view model plus source boundary
        shell: pwsh
        run: |
          cargo fmt --all --manifest-path experiments/desktop-d2-native-egui/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'D2 Rust format failed' }
          cargo test --locked --all-targets --manifest-path experiments/desktop-d2-native-egui/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'D2 native Rust tests failed' }
          cargo clippy --locked --all-targets --manifest-path experiments/desktop-d2-native-egui/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'D2 Clippy failed' }
      - name: Parse Windows real-UIA regression source without opening a GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = 'experiments/desktop-d2-native-egui/tests/windows-native-fhir-uia-qualification.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
          ) | Out-Null
          if (@($errors).Count -ne 0) { throw 'Native Windows UIA test has PowerShell syntax errors' }
          $text = Get-Content -LiteralPath $path -Raw
          if (-not $text.Contains('D2_NATIVE_FHIR_UIA_8_OF_8_PASS_NONPUBLISHING')) { throw 'Missing UIA acceptance marker' }
          if ([regex]::Matches($text, "@\{id='").Count -ne 8) { throw 'Expected eight fictional UIA test cases' }
          Write-Output 'UIA_SCRIPT_SYNTAX_AND_EIGHT_FIXTURES_OK_SOURCE_ONLY_NO_GUI'
      - name: Parse real Windows read-only fictional JSON UIA acceptance script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = 'experiments/desktop-d2-native-egui/tests/windows-native-json-preview-uia.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
          ) | Out-Null
          if (@($errors).Count -ne 0) { throw 'New native UIA preview script syntax failed' }
          $text = Get-Content -LiteralPath $path -Raw
          if (-not $text.Contains('NATIVE_JSON_PREVIEW_3_OF_3_PASS_NONPUBLISHING')) {
            throw 'New preview script lacks full acceptance marker'
          }
          Write-Output 'NEW_JSON_PREVIEW_UIA_POWERSHELL_SOURCE_ONLY_PASS'
      - name: Test synthetic Core-to-D2 report admission and fail-closed Mac sandbox preflight
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          & $py -m unittest discover -s experiments/desktop-d2-native-egui/scripts -p test_qualify_sandboxed_synthetic_core.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Core-to-D2 synthetic report/sandbox contract failed' }
          Write-Output 'D2_CORE_QA_SOURCE_ONLY_OS_SANDBOX_NOT_EXECUTED_ON_RUNNER'
      - name: Source-only synthetic encrypted workspace intent and filesystem denial tests
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          & $py -m unittest discover -s experiments/desktop-d2-native-egui/scripts -p test_age_synthetic_workspace.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic workspace consent/permissions/overwrite contract failed' }
          Write-Output 'SYNTHETIC_AGE_WORKSPACE_SOURCE_ONLY_NO_CI_CRYPTO_OR_CLINICAL_APPROVAL'
      - name: Source-only official FHIR R4 JSON schema provenance and negative gate tests
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          & $py -m unittest discover -s experiments/desktop-d2-native-egui/scripts -p test_offline_fhir_r4_schema.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Pinned HL7 R4 schema admission/fail-close tests failed' }
          Write-Output 'FHIR_R4_SCHEMA_SOURCE_ONLY_NOT_ACTUAL_FHIR_VALIDATOR_OR_CLINICAL_RELEASE'
      - name: Assert private release gate always refuses without independent approval
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          & $py -m unittest discover -s experiments/desktop-d2-native-egui/scripts -p test_private_release_gate.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Private release NO-GO gate contract failed' }
          Write-Output 'PRIVATE_RELEASE_SOURCE_ONLY_NOT_LIVE_GITHUB_OR_CLINICAL_ATTESTATION'
      - name: Source-only Mac AX and genuine keyboard harness regression controls
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          & $py -m unittest discover -s experiments/desktop-d2-native-egui/tests -p test_macos_keyboard_ax_source_contract.py -v
          if ($LASTEXITCODE -ne 0) { throw 'macOS native AX and keyboard source contract refused' }
          Write-Output 'MACOS_AX_KEYBOARD_SOURCE_ONLY_NO_HOSTED_GUI_OR_VOICEOVER_APPROVAL'
      - name: Qualify two exact Python Core provenance reports embedded in native D2 UI
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          & $py -m unittest discover -s experiments/desktop-d2-native-egui/scripts -p test_core_source_embedded_ui.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native D2 embedded Core fixture/provenance contract refused' }
          Write-Output 'D2_CORE_EMBEDDED_2_SOURCE_REPORTS_NOT_VALIDATED_NOT_LIVE_WORKER'
      - name: Windows source-parse real native Core provenance UIA 2-case acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = 'experiments/desktop-d2-native-egui/tests/windows-native-core-provenance-uia.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
          ) | Out-Null
          if (@($errors).Count -ne 0) { throw 'Core provenance native UIA script syntax failed' }
          $text = Get-Content -LiteralPath $path -Raw
          if (-not $text.Contains('D2_WINDOWS_CORE_PROVENANCE_UIA_2_OF_2_PASS_NONPUBLISHING')) {
            throw 'Missing real native Core provenance two-case test marker'
          }
          Write-Output 'WINDOWS_NATIVE_CORE_PROVENANCE_UIA_SOURCE_ONLY_NOT_GUI_EXECUTION'
      - name: Parse Windows native fictional Workspace UIA acceptance script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = 'experiments/desktop-d2-native-egui/tests/windows-native-fictional-workspace-uia.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
          ) | Out-Null
          if (@($errors).Count -ne 0) { throw 'Native fictional workspace Windows UIA script syntax failed' }
          $source = Get-Content -LiteralPath $path -Raw
          if (-not $source.Contains('D2_WINDOWS_FICTIONAL_WORKSPACE_4_CASES_FILTER_AND_CLEAR_PASS_NOT_CLINICAL') -or
              -not $source.Contains('D2_WINDOWS_FICTIONAL_WORKSPACE_RESOURCE_FACET_LINK_AND_BACK_PASS_NOT_CLINICAL')) {
            throw 'Native fictional Workspace filter and verified-reference navigation test markers missing'
          }
          Write-Output 'WINDOWS_FICTIONAL_WORKSPACE_UIA_SOURCE_ONLY_NOT_HOSTED_GUI_APPROVAL'
      - name: Verify installed-Wheel Core to Rust synthetic provenance source guards
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          & $py -m unittest discover -s experiments/desktop-d2-native-egui/scripts -p test_qualify_installed_synthetic_core.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Installed Core wheel provenance/record negative guards failed' }
          Write-Output 'INSTALLED_WHEEL_CORE_SOURCE_ONLY_NO_CI_INSTALL_OR_OS_SANDBOX_CLAIM'
      - name: Source-only strict native GUI one-shot installed Core stdin contract
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          & $py -m unittest discover -s experiments/desktop-d2-native-egui/scripts -p test_qualify_installed_core_into_native_gui.py -v
          if ($LASTEXITCODE -ne 0) { throw 'One-shot installed Core to native GUI source guard refused' }
          Write-Output 'NATIVE_GUI_CORE_STDIN_SOURCE_ONLY_NO_HOSTED_MAC_AX_OR_INSTALLED_CORE_PROOF'
      - name: Parse Windows exact-binary native one-shot Core stdin UIA tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = 'experiments/desktop-d2-native-egui/tests/windows-native-core-stdin-uia.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
          ) | Out-Null
          if (@($errors).Count -ne 0) { throw 'One-shot native stdin UIA PowerShell syntax invalid' }
          $source = Get-Content -LiteralPath $path -Raw
          if (-not $source.Contains('D2_WINDOWS_ONE_SHOT_CORE_STDIN_NATIVE_UIA_2_OF_2_PASS_NOT_CLINICAL')) {
            throw 'Two-case Windows one-shot Core stdin GUI test marker missing'
          }
          Write-Output 'D2_WINDOWS_ONE_SHOT_STDIN_UIA_SOURCE_ONLY_NOT_GUI_EXECUTION'
      - name: Verify bounded native Core stdin no-EOF and stalled-pipe source contract
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          & $py -m unittest discover -s experiments/desktop-d2-native-egui/scripts -p test_native_stdin_deadline.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Native D2 one-shot synthetic stdin deadline source regression failed' }
          Write-Output 'D2_NATIVE_CORE_STDIN_SOURCE_DEADLINE_NOT_HOSTED_GUI_TEST'
      - name: Verify synthetic Windows Job Object descendant kill on-close source contract
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          & $py -m unittest discover -s experiments/desktop-d2-native-egui/scripts -p test_windows_job_subtree.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows synthetic subprocess Job Object source contract failed' }
          Write-Output 'WINDOWS_JOB_SUBTREE_SOURCE_ONLY_NO_HOSTED_DESCENDANT_KILL_CLAIM'
      - name: Real Windows kernel Job Object descendant kill-on-close (synthetic only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & python experiments/desktop-d2-native-egui/scripts/qualify_windows_job_subtree.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows Job Object OS descendant lifecycle proof NO-GO' }
          Write-Output 'WINDOWS_JOB_OBJECT_REAL_OS_SYNTHETIC_CHILD_SUBTREE_KILLED_NO_PATIENT_DATA'
      - name: Verify source-bound encrypted Core Workspace native preview limits
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          & $py -m unittest discover -s experiments/desktop-d2-native-egui/scripts -p test_installed_workspace_to_native_gui.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Encrypted Workspace synthetic Core-to-native GUI source limits FAILED' }
          Write-Output 'D2_ENCRYPTED_WORKSPACE_SOURCE_ONLY_NO_REAL_CI_GUI_OR_INSTALLED_CORE_CLAIM'
      - name: Parse real Windows encrypted Workspace native UIA source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = 'experiments/desktop-d2-native-egui/tests/windows-encrypted-workspace-native-uia.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
          ) | Out-Null
          if (@($errors).Count -ne 0) { throw 'Windows synthetic encrypted Workspace UIA syntax FAILED' }
          if (-not (Get-Content -Raw $path).Contains('D2_WINDOWS_ENCRYPTED_WORKSPACE_NATIVE_UIA_PASS_NONCLINICAL')) {
            throw 'Windows encrypted Workspace GUI QA marker missing'
          }
          Write-Output 'WINDOWS_ENCRYPTED_WORKSPACE_UIA_SYNTAX_ONLY_NOT_ACTUAL_INTERACTION'
      - name: Verify Windows source-pinned live Core Workspace-to-GUI limits
        shell: pwsh
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          & $py -m unittest discover -s experiments/desktop-d2-native-egui/scripts -p test_windows_live_core_workspace_gui.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows live Core Workspace-to-D2 synthetic safety source checks failed' }
          Write-Output 'WINDOWS_LIVE_CORE_WORKSPACE_GUI_SOURCE_ONLY_NOT_HOSTED_FUNCTIONAL_PROOF'
      - name: Verify checks did not alter tracked code or lockfiles
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source or lockfile changed' }
          Write-Output 'NATIVE_D2_SYNTHETIC_ONLY_NOT_RELEASED_NOT_PACKET_ISOLATION_OR_ACCESSIBILITY_APPROVAL'
