          if (-not (Get-Content -LiteralPath $path -Raw).Contains('WINDOWS_NATIVE_EIGHT_RECORD_TWO_PATIENT_STRUCTURAL_FHIR_BUNDLE_GROUP_GRAPH_UIA_PASS_NONCLINICAL')) {
            throw 'Multi-patient Windows native UIA source marker missing'
          }
          Write-Output 'SYNTHETIC_MULTI_PATIENT_WINDOWS_UIA_SYNTAX_ONLY_NOT_HOSTED_GUI_APPROVAL'
      - name: Verify checks did not alter tracked code or lockfiles
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source or lockfile changed' }
          Write-Output 'NATIVE_D2_SYNTHETIC_ONLY_NOT_RELEASED_NOT_PACKET_ISOLATION_OR_ACCESSIBILITY_APPROVAL'
