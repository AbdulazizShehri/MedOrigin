# Exact-head, no-publish full CI replay of the complete FHIR draft stack.
# Tests a 48-commit integrated source candidate; never updates protected main.
name: FHIR integrated Draft full CI (nonpublishing)

on:
  push:
    branches:
      - ci/medorigin-fhir-48commit-full-qualification-20261030
      - fix/medorigin-fhir-json-float-overflow-20261030
      - fix/medorigin-fhir-bounded-json-depth-20261030
      - candidate/medorigin-fhir-wheel-unpublished-20261030
      - fix/medorigin-fhir-bounded-input-bytes-20261030
      - fix/medorigin-fhir-bounded-report-artifacts-20261031
      - fix/medorigin-fhir-nonregular-input-20261031
  pull_request:
    branches: [test/medorigin-beta-fhir-strict-unicode-input-20261029]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: fhir-48commit-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_SHARD_COUNT: "8"

jobs:
  static:
    name: static (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Isolate runner cache stalls observed in two shard-4 setup-uv steps.
          enable-cache: false

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Docs link hygiene
        run: uv run python scripts/check_docs_links.py

      # CI checks out full Git history above; this only exports the pinned
      # historical and current source into isolated synthetic temp trees.
      # Exit 0 means the documented incompatibility was reproduced, NOT release-ready.
      - name: Historical synthetic dataset format replay (read-only)
        run: >-
          uv run --no-sync python scripts/audit_historical_dataset_compatibility.py
          --repo .
          --json-out "${{ runner.temp }}/medorigin-history-${{ matrix.python-version }}.json"

      - name: MRL canonical closeout evidence live binding
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run python scripts/mrl_closeout_evidence.py
          --verify specs/mesc-research-loop-v1/closeout-evidence-v1.json

      # CW-001: the root configuration and lockfile are frozen research evidence.
      # Type-check Workspace separately, using the same pinned CW-002 AEAD
      # dependency as the existing pytest-shard job, without syncing or editing
      # root pyproject.toml or uv.lock.
      - name: Install CW-002 Workspace AEAD typing dependency
        run: uv pip install --python .venv "cryptography==50.0.1"

      - name: Mypy (strict Workspace)
        run: uv run --no-sync mypy --strict --no-incremental apps/workspace/src/medscale_workspace

  pytest-shard:
    name: pytest shard ${{ matrix.shard }} (py${{ matrix.python-version }})
    needs: static
    runs-on: ubuntu-latest
    # Bound stalled shards: the previous successful shard-3 run took ~15 min.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Isolate runner cache stalls observed in two shard-4 setup-uv steps.
          enable-cache: false

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync (locked)
        run: uv sync --frozen

      # CW-002 (ADR-0039 decision 5, amendment A1.8) admits exactly one Workspace
      # runtime dependency for the AEAD primitive. pyproject.toml and uv.lock are
      # frozen sources of the MRL-0809 static prerequisite manifest, so the Workspace
      # dependency is installed into the already-synced environment instead of
      # drifting the Research Core lock; --no-sync keeps that environment exact.
      - name: Install the CW-002 Workspace AEAD dependency
        run: uv pip install --python .venv "cryptography==50.0.1"

      - name: Build deterministic test-node shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          shard_count = int(os.environ["PYTEST_SHARD_COUNT"])
          shard_index = int(os.environ["SHARD_INDEX"])
          if shard_count <= 0 or not 0 <= shard_index < shard_count:
              raise SystemExit("invalid pytest shard identity")

          collected = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q"],
              check=False,
              capture_output=True,
              text=True,
              encoding="utf-8",
          )
          if collected.returncode != 0:
              sys.stderr.write(collected.stdout)
              sys.stderr.write(collected.stderr)
              raise SystemExit(
                  f"pytest collection failed with exit code {collected.returncode}"
              )

          nodeids = sorted(
              line.strip()
              for line in collected.stdout.splitlines()
              if line.startswith("tests/") and "::" in line
          )
          summary_matches = re.findall(
              r"(\d+)(?:/\d+)? tests? collected", collected.stdout
          )
          if not summary_matches:
              raise SystemExit("pytest collection summary was not found")
          collected_count = int(summary_matches[-1])
          if collected_count != len(nodeids):
              raise SystemExit(
                  "pytest node inventory does not match collection summary: "
                  f"summary={collected_count} inventory={len(nodeids)}"
              )
          if len(nodeids) != len(set(nodeids)):
              raise SystemExit("pytest node inventory contains duplicate node IDs")
          if len(nodeids) < shard_count:
              raise SystemExit("pytest node inventory is smaller than shard count")

          buckets = [nodeids[index::shard_count] for index in range(shard_count)]
          flattened = [nodeid for bucket in buckets for nodeid in bucket]
          if len(flattened) != len(nodeids) or set(flattened) != set(nodeids):
              raise SystemExit("pytest node shard plan is incomplete or overlapping")
          if any(not bucket for bucket in buckets):
              raise SystemExit("pytest node shard plan contains an empty shard")

          selected = buckets[shard_index]
          manifest = "\n".join(selected) + "\n"
          Path("pytest-shard.txt").write_text(
              manifest,
              encoding="utf-8",
              newline="\n",
          )
          digest = hashlib.sha256(manifest.encode("utf-8")).hexdigest()
          benchmark_prefix = "tests/test_mesc_mrl_researcher_benchmark_v1.py::"
          benchmark_counts = [
              sum(nodeid.startswith(benchmark_prefix) for nodeid in bucket)
              for bucket in buckets
          ]
          print(
              f"PYTEST_SHARD index={shard_index} nodes={len(selected)} "
              f"sha256={digest}"
          )
          print(
              "PYTEST_SHARD_PLAN "
              + " ".join(
                  f"{index}:{len(bucket)}"
                  for index, bucket in enumerate(buckets)
              )
          )
          print(
              "PYTEST_BENCHMARK_DISTRIBUTION "
              + " ".join(
                  f"{index}:{count}"
                  for index, count in enumerate(benchmark_counts)
              )
          )
          PY

      - name: Pytest shard with coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage.py${{ matrix.python-version }}.shard${{ matrix.shard }}
        shell: bash
        run: |
          mapfile -t test_nodes < pytest-shard.txt
          test "${#test_nodes[@]}" -gt 0
          # Show each test node while it executes to identify a stalled case.
          # Preserve complete coverage and fail closed on the job timeout.
          uv run --no-sync pytest \
            -vv --durations=15 \
            --cov --cov-report= --cov-fail-under=0 \
            "${test_nodes[@]}"
          test -s "${COVERAGE_FILE}"

      - name: Preserve shard coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-py${{ matrix.python-version }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/.coverage.py${{ matrix.python-version }}.shard${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  quality:
    name: quality (py${{ matrix.python-version }})
    needs: [static, pytest-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Require successful static and full-shard qualification
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          PYTEST_SHARD_RESULT: ${{ needs.pytest-shard.result }}
        shell: bash
        run: |
          test "${STATIC_RESULT}" = "success"
          test "${PYTEST_SHARD_RESULT}" = "success"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Isolate runner cache stalls observed in two shard-4 setup-uv steps.
          enable-cache: false

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Download exact-version shard coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-py${{ matrix.python-version }}-shard-*
          path: ${{ runner.temp }}/coverage-shards
          merge-multiple: true

      - name: Combine coverage and enforce repository threshold
        shell: bash
        run: |
          mapfile -t coverage_files < <(
            find "${RUNNER_TEMP}/coverage-shards"               -maxdepth 1               -type f               -name ".coverage.py${{ matrix.python-version }}.shard*"               -print | sort
          )
          test "${#coverage_files[@]}" -eq "${PYTEST_SHARD_COUNT}"
          uv run coverage combine "${RUNNER_TEMP}/coverage-shards"
          uv run coverage report --show-missing --fail-under=77

      - name: MRL machine-state drift/manual-edit gate
        run: uv run pytest -q tests/test_mesc_mrl_machine_state_ci_gate_v1.py

      # ADR-0017: corpus<->log referential integrity is a hard gate, not a convention.
      - name: litdb integrity (medscale check)
        run: uv run medscale check
