name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  # Read-only artifact round-trip on exact protected main without publishing a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q --no-header

  build:
    name: build artifacts
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync
        run: uv sync --frozen
      - name: Build wheel + sdist
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.ref_name }}
          path: dist/*
          retention-days: 30

  install-smoke:
    name: clean installed-wheel smoke
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Download exact build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.ref_name }}
          path: dist
      - name: Install exact wheel and bind CLI version to tag
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python --no-deps "$wheel"
          installed_version="$(.venv/bin/python -c 'from importlib.metadata import version; print(version("medscale"))')"
          test -n "$installed_version"
          test "$(.venv/bin/medscale --version)" = "medscale ${installed_version}"
          test "$GITHUB_REF_NAME" = "v${installed_version}"
      - name: Verify installed wheel canonical MedOrigin URLs before publication
        shell: bash
        run: |
          # Inspect the actual installed wheel METADATA, not the source checkout.
          # A release must not claim the old MESC repository identity.
          .venv/bin/python - <<'PY'
          from importlib.metadata import metadata

          expected = {
              "Homepage": "https://github.com/TheHalfMoon/MedOrigin",
              "Repository": "https://github.com/TheHalfMoon/MedOrigin",
              "Documentation": "https://github.com/TheHalfMoon/MedOrigin/tree/main/docs",
              "Issues": "https://github.com/TheHalfMoon/MedOrigin/issues",
          }
          actual = {}
          for entry in metadata("medscale").get_all("Project-URL") or []:
              key, separator, url = entry.partition(", ")
              if not separator or key in actual:
                  raise SystemExit("Invalid or duplicate wheel Project-URL entry")
              actual[key] = url
          for key, expected_url in expected.items():
              if actual.get(key) != expected_url:
                  raise SystemExit(
                      f"Release blocked: {key} Project-URL is not canonical MedOrigin"
                  )
          print("Installed wheel public project URLs: canonical MedOrigin")
          PY

  github-release:
    name: GitHub Release
    needs: [quality, build, install-smoke]
    runs-on: ubuntu-latest
    # Explicit operator-controlled activation is required in addition to a tag.
    # A passing build is never equivalent to permission to publish.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.GITHUB_RELEASE_PUBLISH_ENABLED == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.ref_name }}
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

  testpypi-publish:
    name: TestPyPI trusted publish
    needs: github-release
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.TESTPYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download exact qualified build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.ref_name }}
          path: dist
      - name: Verify exact distribution payload
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
      - name: Publish exact artifact to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          attestations: true

  pr-artifact-build:
    name: PR-safe build and upload qualification
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Sync
        run: uv sync --frozen
      - name: Build wheel + sdist
        run: uv build
      - name: Prepare byte-identity payload
        shell: bash
        run: |
          mkdir roundtrip-payload
          cp dist/* roundtrip-payload/
          # Pin the SOURCE version beside the exact built wheel. The payload
          # integrity gate binds this separately from the wheel METADATA version.
          uv run --no-sync python -c 'from medscale.__about__ import __version__; print(__version__)' > roundtrip-payload/SOURCE_VERSION
          (cd roundtrip-payload && sha256sum *.whl *.tar.gz SOURCE_VERSION > SHA256SUMS)
      - name: Upload qualification artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-action-roundtrip-${{ github.run_id }}-${{ github.run_attempt }}
          path: roundtrip-payload/
          retention-days: 1

  pr-artifact-roundtrip:
    name: PR-safe download and byte-identity qualification
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: pr-artifact-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download qualification artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-action-roundtrip-${{ github.run_id }}-${{ github.run_attempt }}
          path: roundtrip
      - name: Verify byte identity
        shell: bash
        run: |
          cd roundtrip
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -type f -name '*.whl' | wc -l)" -ge 1
          test "$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -ge 1

  pr-clean-wheel-smoke:
    name: PR-safe clean installed-wheel qualification
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: pr-artifact-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Download exact qualification artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-action-roundtrip-${{ github.run_id }}-${{ github.run_attempt }}
          path: roundtrip
      - name: Install exact wheel and verify current CLI version
        shell: bash
        run: |
          wheel="$(find roundtrip -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python --no-deps "$wheel"
          installed_version="$(.venv/bin/python -c 'from importlib.metadata import version; print(version("medscale"))')"
          test -f roundtrip/SOURCE_VERSION
          (cd roundtrip && sha256sum -c SHA256SUMS)
          expected_version="$(cat roundtrip/SOURCE_VERSION)"
          test -n "$expected_version"
          test "$installed_version" = "$expected_version"
          test "$(.venv/bin/medscale --version)" = "medscale ${installed_version}"
