# Free, synthetic-only quality assurance; no uploads, tokens, or deployment.
name: MedOrigin free automated browser + error QA

on:
  pull_request:
    paths:
      - "scripts/qa_medorigin_free_browser_sentry.py"
      - "examples/synthetic_fhir_developer_beta/**"
      - "scripts/stage_medorigin_core_projection.py"
      - ".github/workflows/medorigin-free-automated-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medorigin-free-automated-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  free-browser-sentry-qa:
    name: Synthetic Playwright + offline Sentry (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout exact source without token persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned uv without cache
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Build and install core, run free local-only QA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv python install '3.11' '3.12'
          if ($LASTEXITCODE -ne 0) { throw 'Python setup failed' }
          $buildPython = (& uv python find '3.12').Trim()
          $scratch = Join-Path $env:RUNNER_TEMP 'medorigin-free-qa'
          if (Test-Path $scratch) { throw 'Refuse existing QA scratch' }
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $env:TMPDIR = $scratch
          $env:TEMP = $scratch
          $env:TMP = $scratch

          $stage = Join-Path $scratch 'core'
          $dist = Join-Path $scratch 'dist'
          & $buildPython scripts/stage_medorigin_core_projection.py --out $stage
          if ($LASTEXITCODE -ne 0) { throw 'Source Core projection failed' }
          uv build --wheel $stage --out-dir $dist
          if ($LASTEXITCODE -ne 0) { throw 'Wheel build failed' }
          $wheel = Join-Path $dist 'medscale-0.3.0-py3-none-any.whl'
          if (!(Test-Path $wheel)) { throw 'Required exact Core Wheel missing' }

          $core311 = Join-Path $scratch 'core311'
          $core312 = Join-Path $scratch 'core312'
          $qa = Join-Path $scratch 'qa'
          uv venv --python '3.11' $core311
          if ($LASTEXITCODE -ne 0) { throw 'Core 3.11 environment failed' }
          uv venv --python '3.12' $core312
          if ($LASTEXITCODE -ne 0) { throw 'Core 3.12 environment failed' }
          uv venv --python '3.12' $qa
          if ($LASTEXITCODE -ne 0) { throw 'Isolated QA environment failed' }

          $cli311 = Join-Path $core311 'Scripts/medscale.exe'
          $cli312 = Join-Path $core312 'Scripts/medscale.exe'
          uv pip install --python (Join-Path $core311 'Scripts/python.exe') --no-index --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Clean 3.11 Core install failed' }
          uv pip install --python (Join-Path $core312 'Scripts/python.exe') --no-index --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Clean 3.12 Core install failed' }

          # QA tooling only. The clean Core installations above remain separate.
          # Only the package index is contacted here; no app evidence is uploaded.
          $qaPython = Join-Path $qa 'Scripts/python.exe'
          uv pip install --python $qaPython 'playwright==1.64.1' 'sentry-sdk==2.73.0'
          if ($LASTEXITCODE -ne 0) { throw 'Free QA packages unavailable' }
          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if (!(Test-Path $edge)) {
            $edge = 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
          }
          if (!(Test-Path $edge)) { throw 'Installed free Edge browser unavailable' }

          & $qaPython scripts/qa_medorigin_free_browser_sentry.py `
            --cli311 $cli311 --cli312 $cli312 --edge $edge
          if ($LASTEXITCODE -ne 0) { throw 'Real Playwright and memory-only Sentry QA failed' }

          if (@(git status --porcelain).Count -gt 0) {
            throw 'QA modified committed source tree'
          }
          Write-Output 'NONPUBLISHING_FREE_QA_PASS'
