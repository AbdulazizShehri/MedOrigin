# Nonpublishing source-only Windows junction regression; never builds installers.
name: FHIR Windows reparse-point Draft source qualification

on:
  push:
    branches: [fix/medorigin-fhir-windows-junction-20261031]
  pull_request:
    branches: [fix/medorigin-fhir-atomic-report-20261031]

permissions:
  contents: read

concurrency:
  group: fhir-windows-junction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-junction:
    name: Windows junction (py${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Checkout exact Draft source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Install pinned uv without cache
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Pinned Ruff lint and format
        run: |
          uvx --python ${{ matrix.python }} ruff==0.14.4 check src/medscale/fhirkit/storage.py tests/test_fhir_windows_junction_storage.py
          uvx --python ${{ matrix.python }} ruff==0.14.4 format --check src/medscale/fhirkit/storage.py tests/test_fhir_windows_junction_storage.py

      - name: Real Windows junction and atomic synthetic regressions
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-project --python ${{ matrix.python }} --with pytest==8.4.2
          python -m pytest -q
          tests/test_fhir_windows_junction_storage.py
          tests/test_fhir_storage_atomic_publish.py

      - name: Nonpublishing marker
        run: echo "FHIR_WINDOWS_JUNCTION_DRAFT_NOT_RELEASE_APPROVED"
