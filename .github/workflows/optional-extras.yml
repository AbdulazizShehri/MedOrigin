name: Optional Extras / Backends

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/optional-extras.yml'
      - 'src/medscale/backends/**'
      - 'specs/mesc-experiment-0/fhir-r4/address.profile.json'
      - 'specs/mesc-experiment-0/fhir-r4/patient.profile.json'
      - '.gitattributes'
      - 'src/medscale/mesc/_mrl_0809_*.py'
      - 'specs/mesc-experiment-0/mrl-0809-*'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/test_modelkit_backends.py'
      - 'tests/test_mesc_mrl_0809_*.py'

jobs:
  backends-transformers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install transformer extra
        run: uv sync --extra backends-transformers --frozen
      - name: Run backend tests with transformers
        run: uv run pytest tests/test_modelkit_backends.py -q --no-header

  backends-llamacpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install llama.cpp extra
        run: uv sync --extra backends-llamacpp --frozen
      - name: Run backend tests with llama.cpp available
        run: uv run pytest tests/test_modelkit_backends.py -k 'llamacpp or llamacpp_skip' -q --no-header

  core-without-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install core only
        run: uv sync --frozen
      - name: Ensure backend package import is safe on core
        run: uv run python -c 'import medscale.backends'
      - name: Run core verification
        run: uv run ruff check . && uv run mypy src tests

  rq1-grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install exact RQ1 grammar extra
        run: uv sync --extra rq1-grammar --frozen
      - name: Run RQ1 grammar prerequisite and XGrammar integration tests
        run: >-
          uv run pytest
          tests/test_mesc_mrl_0809_prerequisites_v1.py
          tests/test_mesc_mrl_0809_xgrammar_integration_v1.py
          -q --no-header
  rq1-runtime-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install minimal MRL-0809 runtime-feasibility extra
        run: uv sync --no-dev --extra rq1-runtime-feasibility --frozen
      - name: Verify exact runtime-feasibility package surface
        run: >-
          uv run --no-sync python -c
          'import importlib.metadata as m; expected={"accelerate":"1.14.0","bitsandbytes":"0.50.2","huggingface-hub":"1.23.0","pillow":"13.0.0","torch":"2.13.0","torchvision":"0.28.0","transformers":"5.16.1","xgrammar":"0.2.7"};
          assert {name:m.version(name) for name in expected} == expected;
          forbidden=("datasets","peft","trl");
          assert all(next(iter(m.packages_distributions().get(name, [])), None) is None for name in forbidden)'
