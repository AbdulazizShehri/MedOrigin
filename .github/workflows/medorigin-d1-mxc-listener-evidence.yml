# Nonpublishing source-only negative tests; no native sockets, MXC, WFP or release.
name: D1 MXC listener receipt binding (source-only)
on:
  push:
    branches:
      - test/medorigin-d1-mxc-listener-evidence-20261102
  pull_request:
    branches:
      - test/medorigin-d1-mxc-positive-control-integrity-20261102
    paths:
      - '.github/workflows/medorigin-d1-mxc-listener-evidence.yml'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-listener-evidence.test.mjs'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-positive-control-integrity.test.mjs'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-protocol-matrix-verdict.mjs'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-protocol-matrix-negative.mjs'
permissions:
  contents: read
jobs:
  windows-source-only:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Test strict listener receipts and inherited MXC matrix
        shell: pwsh
        run: |
          $p='experiments/desktop-d1-tauri/tests'
          node --check "$p/windows-mxc-protocol-matrix-verdict.mjs"
          if($LASTEXITCODE -ne 0){throw 'verifier parse failure'}
          node --check "$p/windows-mxc-protocol-matrix-negative.mjs"
          if($LASTEXITCODE -ne 0){throw 'runner parse failure'}
          node --test "$p/windows-mxc-listener-evidence.test.mjs" "$p/windows-mxc-positive-control-integrity.test.mjs" "$p/windows-mxc-protocol-matrix-verdict.test.mjs" "$p/windows-mxc-protocol-matrix-stdio.test.mjs" "$p/windows-mxc-protocol-matrix-contract.test.mjs"
          if($LASTEXITCODE -ne 0){throw 'source-only MXC listener evidence NO-GO'}
          Write-Output 'D1_MXC_LISTENER_SOURCE_ONLY_NOT_OS_PACKET_ATTESTATION'
