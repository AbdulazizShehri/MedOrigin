# Nonpublishing synthetic source tests only. This workflow does not demonstrate
# OS network enforcement, packet-level telemetry, native MXC or actual WebView2.
name: D1 MXC owned endpoint fail-closed source contracts
on:
  push:
    branches: [test/medorigin-d1-mxc-endpoint-negative-20261101]
  pull_request:
    branches: [fix/medorigin-mxc-sdk-import-gate-20261031]
    paths:
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-d1-network-endpoint-guard.ps1'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-d1-network-endpoint-guard.test.ps1'
      - 'experiments/desktop-d1-tauri/tests/windows-mxc-d1-real-uia-qualification.ps1'
      - '.github/workflows/desktop-d1-mxc-endpoint-negative-source.yml'
permissions:
  contents: read
jobs:
  windows-source:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Strict synthetic TCP and UDP negative cases and real harness binding
        shell: pwsh
        run: |
          & experiments/desktop-d1-tauri/tests/windows-mxc-d1-network-endpoint-guard.test.ps1
      - name: Check PowerShell syntax for tested observer and guards
        shell: pwsh
        run: |
          $paths = @(
            'experiments/desktop-d1-tauri/tests/windows-mxc-d1-network-endpoint-guard.ps1',
            'experiments/desktop-d1-tauri/tests/windows-mxc-d1-network-endpoint-guard.test.ps1',
            'experiments/desktop-d1-tauri/tests/windows-mxc-d1-real-uia-qualification.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw ('D1 PowerShell parser NO-GO: ' + $path) }
          }
          Write-Output 'D1_MXC_POWERSHELL_SOURCE_PARSE_PASS_NO_NATIVE_ATTESTATION'
      - name: Verify bounded real GUI observation budgets
        shell: pwsh
        run: |
          node --test experiments/desktop-d1-tauri/tests/windows-mxc-d1-real-app-timeout-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Real MXC observation timeout source contract failed' }
      - name: Validate synthetic local-only MXC comparison source and native Rust probe
        shell: pwsh
        run: |
          $tests='experiments/desktop-d1-tauri/tests'
          node --check "$tests/windows-mxc-synthetic-local-socket-differential.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic differential script syntax NO-GO' }
          node --test "$tests/windows-mxc-synthetic-local-socket-source-contract.test.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic comparison source contract NO-GO' }
          rustc --edition 2024 --emit metadata -o "$env:RUNNER_TEMP/d1-synthetic-probe.rmeta" "$tests/windows-mxc-synthetic-local-socket-probe.rs"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic Rust probe compile NO-GO' }
          node --check "$tests/windows-mxc-synthetic-private-interface-differential.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Private host-interface differential syntax NO-GO' }
          node --test "$tests/windows-mxc-synthetic-private-interface-source-contract.test.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Private host-interface source contract NO-GO' }
          rustc --edition 2024 --emit metadata -o "$env:RUNNER_TEMP/d1-private-probe.rmeta" "$tests/windows-mxc-synthetic-private-interface-probe.rs"
          if ($LASTEXITCODE -ne 0) { throw 'Private host-interface Rust probe compile NO-GO' }
          Write-Output 'D1_MXC_HOST_OWNED_PRIVATE_INTERFACE_SOURCE_PASS_NO_REMOTE_PACKET_PROOF'
          Write-Output 'D1_MXC_LOCAL_DIFFERENTIAL_SOURCE_ONLY_NO_PACKET_OR_DNS_PROOF'
      - name: Test guarded preview launch admission and no uncontained fallback
        shell: pwsh
        run: |
          $tests='experiments/desktop-d1-tauri/tests'
          node --check "$tests/windows-mxc-d1-guarded-preview-launch.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Guarded MXC launcher syntax NO-GO' }
          node --test "$tests/windows-mxc-d1-guarded-launch.test.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Guarded MXC launcher source/preflight NO-GO' }
          Write-Output 'D1_GUARDED_PREVIEW_SOURCE_ONLY_NO_PRODUCT_ENFORCEMENT_NO_RELEASE'
      - name: Qualification boundary
        shell: pwsh
        run: |
          Write-Output 'SYNTHETIC_SOURCE_ONLY_NO_PACKET_PROOF_NO_NATIVE_MXC_NO_WEBVIEW2_NO_RELEASE'
