# MedScale — packaging and tool configuration.
# One cohesive package (src-layout). Research-heavy subpackages are added only when
# there is research to put in them (see docs/adr/0004-t0-foundation-scope.md).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medscale"
dynamic = ["version"]
description = "An open research platform for verifiable clinical AI: FHIR-native, grammar-constrained, validator-grounded, reproducible."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{ name = "Abdulaziz Alshehri" }]
keywords = [
  "healthcare",
  "fhir",
  "clinical-ai",
  "verifiable-ai",
  "constrained-decoding",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
medscale = "medscale.cli:main"

[project.urls]
Homepage = "https://github.com/AbdulazizShehri/MedOrigin"
Repository = "https://github.com/AbdulazizShehri/MedOrigin"
Documentation = "https://github.com/AbdulazizShehri/MedOrigin/tree/main/docs"
Issues = "https://github.com/AbdulazizShehri/MedOrigin/issues"

[project.optional-dependencies]
backends-transformers = [
  "transformers>=4.44",
]
backends-llamacpp = [
  "llama-cpp-python>=0.3.21; sys_platform != 'win32'",
]
rq1-grammar = [
  "torch==2.13.0",
  "transformers==5.16.1",
  "xgrammar==0.2.7",
]
rq1-runtime-feasibility = [
  "accelerate==1.14.0",
  "bitsandbytes==0.50.2",
  "huggingface-hub==1.23.0",
  "pillow==12.3.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.16.1",
  "xgrammar==0.2.7",
]
training-hf-sft = [
  "accelerate==1.14.0",
  "bitsandbytes==0.50.2",
  "datasets==5.0.1",
  "peft==0.20.0",
  "torch==2.13.0",
  "transformers==5.16.1",
  "trl==1.12.0",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyarrow==25.0.1",
]

[tool.hatch.version]
path = "src/medscale/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/medscale"]

# Core source distributions must not accidentally ship frozen research receipts,
# datasets, notebooks, or other repository-only material. Keep their integrity
# and provenance in GitHub; package only the installable code and legal notices.
[tool.hatch.build.targets.sdist]
only-include = ["src/medscale", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "PTH",  # flake8-use-pathlib
  "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["medscale"]

[tool.ruff.lint.per-file-ignores]
"tests/test_pubmedqa_source_transform.py" = ["E501"]
# Experiment-0 preparation artifacts intentionally preserve explicit/auditable contract
# spellings and Colab cell layout; these exceptions are style-only and do not suppress
# correctness, import, security, typing, or test execution gates.
"notebooks/MESC_Experiment_0_Colab.ipynb" = ["E501", "UP017"]
"tests/test_verify_mesc_experiment_0_evidence.py" = ["RUF043"]
# These frozen contract files are byte-identity evidence in independent qualification gates.
# Keep their canonical bytes unchanged while newer Ruff versions enforce RUF036 elsewhere.
"src/medscale/mesc/_bt_executor_core_fixture_v1.py" = ["RUF036"]
"src/medscale/mesc/_canonical_json_v1.py" = ["RUF036"]
# MRL-0801 acquisition intentionally uses descriptor-relative os APIs so validated directory
# inodes, not mutable pathnames, remain the security boundary. Pathlib substitutions would
# weaken that guarantee. E501/RUF100/RUF021 are style-only for this bounded executor and remain
# review-visible while the contents API preserves the descriptor-hardening source bytes.
"src/medscale/mesc/_mrl_0801_hf_acquisition_v1.py" = ["PTH106", "PTH116", "PTH208", "E501", "RUF100", "RUF021"]
"src/medscale/mesc/_mrl_0809_fhir_gbnf_v1.py" = ["E501"]

[tool.ruff.format]
# Preserve the notebook's explicit Colab cell layout while continuing to lint every code cell.
# The MRL-0801 descriptor-hardening source is excluded from formatting only; full Ruff lint,
# strict mypy, tests, CodeQL, and independent review remain required on its exact bytes.
exclude = [
  "notebooks/MESC_Experiment_0_Colab.ipynb",
  "src/medscale/mesc/_mrl_0801_hf_acquisition_v1.py",
]

# ---------------------------------------------------------------------------
# Mypy — strict typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
disable_error_code = ["import-untyped"]

# Pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/medscale"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 77
