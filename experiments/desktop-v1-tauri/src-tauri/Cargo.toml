[package]
name = "medorigin-desktop-v1"
version = "0.0.0"
description = "Unreleased synthetic-only MedOrigin Desktop v1 experiment (Slice 1)"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "medorigin_desktop_v1_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
