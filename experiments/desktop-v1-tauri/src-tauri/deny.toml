# cargo-deny policy for the MedOrigin Desktop v1 experiment.
# No HTTP client crates exist in this tree; we ban the common ones so none
# can appear unnoticed. License allowlist is deliberately narrow.

[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = [
  { name = "reqwest" },
  { name = "hyper" },
  { name = "ureq" },
  { name = "curl" },
  { name = "isahc" },
  { name = "native-tls" },
  { name = "openssl" },
  { name = "openssl-sys" },
]
skip = []
skip-tree = []

[advisories]
yanked = "warn"
ignore = []
