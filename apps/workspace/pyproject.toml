[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medscale-workspace"
dynamic = ["version"]
description = "Local-first MedOrigin Clinical Workspace (synthetic-only research foundation)."
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{ name = "Abdulaziz Alshehri" }]
# CW-002 capability expansion, recorded by ADR-0039 decisions 5 and 7 and
# reconciled by amendment A1.8: exactly one runtime dependency, for the AEAD
# primitive only. Key derivation, envelope encoding, key-version handling and
# migration remain reviewed code in this package.
dependencies = ["cryptography==50.0.1"]

# The runtime __version__ remains the single source for wheel/sdist metadata.
# Preserve the legacy distribution and import names for backward compatibility.
[tool.hatch.version]
path = "src/medscale_workspace/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/medscale_workspace"]
[project.optional-dependencies]
asr-local = ["torch==2.13.0", "transformers==5.16.1"]
